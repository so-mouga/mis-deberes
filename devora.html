<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>¡Ñam!</title>
<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="pause.css?v=1">
<style>
  .bulle{top:14px;max-width:92%;white-space:normal;text-align:center}
  .terrain{background:#1C7CC2}
  /* Le bouton de pouvoir : sur le côté, il se remplit en mangeant, il brille quand il est prêt */
  .pouvoir{position:absolute;right:10px;bottom:86px;z-index:4;width:86px;height:86px;border-radius:50%;padding:0;border:0;
    background:conic-gradient(#FFD34D calc(var(--c,0)*1turn),rgba(255,255,255,.22) 0);display:grid;place-items:center;touch-action:none;
    box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .15s}
  .pouvoir i{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8B6CFF,#3B1F8F);display:grid;place-items:center;border:3px solid #fff}
  .pouvoir svg{width:44px;height:44px;opacity:.55}
  .pouvoir b{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:.8}
  .pouvoir.pret{animation:pret 1s ease-in-out infinite}
  .pouvoir.pret i{background:radial-gradient(circle at 35% 30%,#FFE27A,#F08A1C);box-shadow:0 0 22px 6px rgba(255,211,77,.8)}
  .pouvoir.pret svg{opacity:1}
  .pouvoir.non{animation:non .3s}
  @keyframes pret{50%{transform:scale(1.1)}}
  @keyframes non{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){.pouvoir.pret,.pouvoir.non{animation:none}}
</style>
</head>
<body>
<main class="jeu">
  <div class="hud"><h1 id="titre">¡Ñam!</h1><div class="temps"><i id="barre"></i></div><span class="total" id="total"><span class="ani"><img id="tete" src="img/02.jpg" alt=""></span><span id="nb">0</span></span></div>
  <div class="ultimo" id="ultimo" hidden>¡Último minuto!</div>
  <section class="terrain" id="terrain">
    <canvas id="toile"></canvas>
    <div class="bulle" id="bulle" hidden></div>
    <button class="pouvoir" id="pouvoir" aria-label="Poder"><i id="icone"></i><b id="nomPouvoir"></b></button>
  </section>
</main>
<section class="ecran-fin" id="fin" hidden></section>

<script src="commun.js?v=11"></script>
<script src="animaux.js?v=12"></script>
<script src="sync.js?v=8"></script>
<script src="pause-commun.js?v=4"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOUX = DOUX_JEU;

  // =====================================================================
  // LES IDÉES DU JEU : tout ce que Dorian peut inventer est ICI, et seulement ici
  // (nom du jeu, nom du héros, phrases, nom du jefe). Le reste du code ne contient pas de texte.
  // =====================================================================
  const IDEES = {
    nom: "¡Ñam!",
    heros: { n: 2, nom: "el tiburón" },       // son requin : img/sprite/02.webp
    consigne: "¡Come peces pequeños y crece! ¡Cuidado con los grandes!",
    geste: "Pon el dedo y nada",
    bouchees: ["¡Ñam!", "¡Ñam ñam!", "¡Rico!", "¡Crunch!"],
    frenesi: "¡Frenesí!",
    recrache: ["¡Puaj!", "¡Sabes a calcetín!", "¡Pica!", "¡Qué asco, brócoli!"], // un gros le recrache : jamais mangé pour de bon
    revanche: "¡Revancha!",
    plusGrand: "¡Ahora eres más grande! ¡Cómetelo!",
    peur: "¡Ahora te tienen miedo!",
    sombra: "¡Uy! ¿Qué es eso?",
    evolution: (nom) => `¡${nom} ha evolucionado!`,
    superpoder: { nom: "¡Imán!", titre: "¡Superpoder: imán!", dit: "¡Superpoder: imán! La comida viene sola." },
    medusa: "¡Bzz!", globo: "¡Pincha!", encre: "¡Tinta!", murena: "¡Ñac!", aviso: "!",
    zones: ["El arrecife", "El bosque de algas", "La cueva oscura", "El abismo"],
    zonesDit: ["¡El arrecife!", "¡El bosque de algas! Cuidado con la morena.", "¡Qué oscuro! La cueva de las medusas.", "¡El abismo! Aquí vive el jefe."],
    jefe: "el Gran Abisal",
    jefeArrive: (jefe) => `¡Cuidado! ¡Llega ${jefe}! Come mucho para ser más grande.`,
    jefeTropGros: ["¡Soy demasiado grande!", "¡Come más!", "¡Todavía no!"],
    jefeMangeable: "¡Ahora! ¡Cómete al jefe!",
    jefeFatigue: "¡Me rindo!",
    nouvelleDescente: "¡Otra vez al fondo, más grande!",
    festin: "¡Ahora todo el mar es tuyo! ¡A comer!",
    rey: "¡Eres el rey del mar!",
    // un pouvoir par transformation (le bouton sur le côté)
    pouvoirs: ["¡Supermordisco!", "¡Torbellino!", "¡Rayo de cristal!", "¡Ola dorada!"],
    nouveauPouvoir: (nom) => `¡Nuevo poder: ${nom}`.replace(/!$/, "") + "!",
    pret: "¡Poder listo!",
    pretToque: "¡Poder listo! Toca el botón.",
    mordu: ["¡Ay!", "¡Ay, mi colita!", "¡Auch!", "¡Mamáaa!"],   // ses animaux mordus pour rire (jamais mangés)
  };

  // Les 4 évolutions du requin, dessinées par Gemini (sprites détourés, pieds en bas, tourné vers la droite).
  // En attendant : null = le sprite de base, qui grossit. Quand les images arrivent : "img/evo/02-2.webp", "02-3", "02-4".
  // Ses animaux de la mer en ennemis (s'il les a) : ils mordent… et se font mordre pour rire (pansement), jamais mangés.
  const MES = mesAnimaux();
  const ANI = { delfin: 6, pulpo: 1, narval: 12, orca: 13 };
  const ANI_OK = (k) => MES.includes(ANI[k]);
  const SPR_ENNEMIS = chargerSprites(Object.values(ANI));
  const CHARGEURS = ["barracuda", "delfin", "narval"]; // ils préviennent (« ! ») puis foncent

  const EVOLUTIONS = [null, "img/evo/requin-2.webp", "img/evo/requin-3.webp", "img/evo/requin-4.webp"]; // Gemini, 28 nov. (sources : animaux/evo/requin-N.jpg)

  // ---- Les 4 zones de la descente ----
  const P = (c, c2, luz) => ({ k: "pez", c, c2, luz });
  const ZONES = [
    { fond: ["#5CC9F2", "#1C7CC2"], nuit: 0,   rayons: .12, decor: ["coral", "anemona", "roca", "coral", "arena"],
      proies: [P("#FFD23F", "#FF8C42"), P("#FF7AA8", "#FFFFFF"), P("#C9D6E3", "#8FA3B8"), { k: "gamba", c: "#FF8F80" }] },
    { fond: ["#33A99D", "#0E5866"], nuit: .18, rayons: .07, decor: ["kelp", "kelp", "tabla", "roca", "kelp"],
      proies: [P("#9BE36B", "#3E8F48"), P("#C9D6E3", "#8FA3B8"), { k: "gamba", c: "#FFB07A" }, P("#FFD23F", "#2E9E57")] },
    { fond: ["#1F4166", "#0A1A2E"], nuit: .55, rayons: 0,   decor: ["sombre", "cristal", "sombre", "cristal"],
      proies: [P("#7FF0FF", "#1D67B0", "#7FF0FF"), { k: "krill", c: "#FF9AD5", luz: "#FF9AD5" }, P("#B8FF7A", "#2E6B3A", "#B8FF7A")] },
    { fond: ["#0D1A38", "#02060F"], nuit: .7,  rayons: 0,   decor: ["sombre", "cristal", "sombre"],
      proies: [P("#FFF27A", "#B05BE0", "#FFF27A"), { k: "krill", c: "#7FF0FF", luz: "#7FF0FF" }, P("#FF9AD5", "#6B3FA0", "#FF9AD5")] },
  ];
  const FZ = [0, .22, .45, .68];         // début de chaque zone (progression du tour)
  const zoneDe = (p) => (p >= FZ[3] ? 3 : p >= FZ[2] ? 2 : p >= FZ[1] ? 1 : 0);

  // ---- Les tailles et le rythme ----
  const R0 = 18;                          // rayon de départ (unités du monde)
  const SEUILS = [1, 2.2, 4.5, 8];        // masse des 4 niveaux d'évolution
  const TIERS = [24, 36, 50];             // rayon des 3 sortes de gros : barracuda ; morena ou pez dientón ; calamar
  const R_JEFE = 62;
  const M_TOUR = 15, F_PLEIN = .8;        // une descente : la masse ×15, atteinte à 80 %
  const F_JEFE = .7, F_SUIT = .75, F_FATIGUE = .83, F_REDDITION = .88;
  const DJ = DUREE_JEU;
  const NB_TOURS = TEST_RAPIDE || MODE_PARTIE ? 1 : Math.max(1, Math.min(3, Math.round(DJ / 180000)));
  const DT = DJ / NB_TOURS;               // durée d'une descente (ms)
  const OUVERTURE = 15000;                // les 15 premières secondes sont écrites à la main
  const GAIN = Math.log(M_TOUR) / (F_PLEIN * DT / 1000 * .8);

  // ---- Hasard : jamais deux parties identiques (GRAINE) ----
  const hasard = (graine) => () => { graine = graine + 0x6D2B79F5 | 0; let t = Math.imul(graine ^ graine >>> 15, 1 | graine); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const alea = hasard(GRAINE * 7919 + 13);
  const entre = (a, b) => a + alea() * (b - a);
  const choisir = (l) => l[Math.floor(alea() * l.length)];
  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  const ARC = ["#E0453F", "#F08A1C", "#F2B90F", "#2E9E57", "#3FB8E8", "#B05BE0"];
  const ZONE_DOREE = 1 + GRAINE % 3;      // la zone où arrive le banc de poissons dorés
  const MORENES = alea() < .5;            // pour le 2e gros : surtout des morenes, ou surtout des pez dientón
  const JEFE_COUL = [["#1E2448", "#3A4275", "#7FF0FF"], ["#3A1E48", "#6B3F7A", "#FFB0F0"], ["#13343A", "#2C5E66", "#B8FF7A"]][GRAINE % 3];
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const melangeCoul = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`; };

  // ---- Sons (jamais de son d'échec) ----
  const GAMME = [784, 880, 988, 1046, 1175, 1318, 1568, 1760];
  const sonBouchee = (n) => { const i = Math.min(n - 1, GAMME.length - 1); note(330, 170, .07, .13, "triangle"); setTimeout(() => note(GAMME[i], GAMME[i] * 1.4, .09, .08), 40); };
  const sonRevanche = () => { bruitFiltre(500, 1.2, .25, .9); note(180, 90, .2, .25, "triangle"); [659, 880, 1175].forEach((f, i) => setTimeout(() => note(f, f * 1.5, .14, .1), 100 + i * 70)); };
  const sonEvolution = () => [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => note(f, f * 1.02, .2, .12), i * 90));
  const sonGrave = (v = .2) => { note(110, 70, .7, v, "triangle"); setTimeout(() => note(92, 60, .7, v * .9, "triangle"), 500); };
  const sonFanfare = () => { bruitFiltre(400, 1, .4, 1); [523, 659, 784, 1046, 784, 1046, 1318, 1568].forEach((f, i) => setTimeout(() => note(f, f * 1.01, .18, .13), i * 110)); };
  const sonZap = () => { note(1400, 300, .12, .06, "square"); setTimeout(() => note(1200, 400, .1, .05, "square"), 70); };
  const sonEncre = () => bruitFiltre(300, .8, .35, .9);
  const sonZone = () => { bruitFiltre(900, 1, .6, .5); [392, 523, 659].forEach((f, i) => setTimeout(() => note(f, f, .25, .08), i * 140)); };

  // ---- Toile ----
  const toile = $("toile"), g = toile.getContext("2d");
  let L = 1, H = 1;
  function dimensionner() {
    const dpr = Math.min(devicePixelRatio || 1, 2), t = $("terrain");
    L = t.clientWidth; H = t.clientHeight;
    toile.width = L * dpr; toile.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", dimensionner);

  // ---- État ----
  const A = animalN(IDEES.heros.n), NOM = IDEES.heros.nom.charAt(0).toUpperCase() + IDEES.heros.nom.slice(1);
  let fini = false;
  const cam = { x: 0, y: 0, z: 1.6 };
  const heros = { x: 0, y: 0, vx: 0, vy: 0, m: 1, invul: 0, recul: 0, rot: 0, vers: 1, croque: 0, niveau: 0, t: 0, lent: 0, charge: 0, cdCharge: 0,
    sprite: imageSure(spriteAnimal(IDEES.heros.n)), rond: imageSure(imgAnimal(IDEES.heros.n)), imgs: EVOLUTIONS.map((s) => (s ? imageSure(s) : null)) };
  const rayonDe = (m) => R0 * Math.sqrt(m);
  const hr = () => rayonDe(heros.m);
  let ents = [], pops = [], anneaux = [], machoires = [], taches = [], cristaux = [];
  const ambiance = [];
  const eclats = new Eclats();
  const doigt = { actif: false, x: 0, y: 0 };
  let aTouche = false, tJeu = 0, tour = 0, m0 = 1, debutTour = 0;
  let zone = 0, zonePrec = 0, zoneT = 99, sombra = null, ouvertureEtape = 0;
  let jefe = null, jefeMange = false, jefeVaincu = false, festin = false;
  let bouchees = 0, ralenti = 0, secousse = 0, voile = 0, frenesi = 0, comboN = 0, dernierCombo = -9999;
  let prochainDanger = 7000, prochainRevanche = 0, prochainSpawn = 0, prochainSpecial = 0, premiereRevanche = true, yeuxT = 5;
  const annonces = new Set();
  // la progression d'une descente (0 → 1). Dans une longue partie, les 15 premières secondes vont vite : la promesse du jeu arrive tôt.
  const prog = () => {
    const t = tJeu - debutTour;
    if (tour > 0 || DT <= 75000) return t / DT;
    return t < OUVERTURE ? .2 * t / OUVERTURE : .2 + .8 * (t - OUVERTURE) / (DT - OUVERTURE);
  };
  const dernierTour = () => tour >= NB_TOURS - 1;
  const mCible = (p) => m0 * Math.pow(M_TOUR, Math.min(p, 1) / F_PLEIN);
  const plancher = () => (tour === 0 ? SEUILS[heros.niveau] : m0);
  const echelle = () => Math.sqrt(m0);
  const bulle = (txt, ms = 2200, or = false) => messageJeu($("bulle"), txt, ms, or);
  const pop = (x, y, txt, c = "#fff", taille = 22) => pops.push({ x, y, txt, c, taille, t: 0 });
  const aJefe = (nom) => (nom.startsWith("el ") ? "al " + nom.slice(3) : "a " + nom);

  // ---- Le doigt : le requin va vers lui (la caméra le garde au centre) ----
  const posDoigt = (e) => { const r = toile.getBoundingClientRect(); doigt.x = e.clientX - r.left; doigt.y = e.clientY - r.top; };
  toile.addEventListener("pointerdown", (e) => {
    doigt.actif = true; posDoigt(e); try { toile.setPointerCapture(e.pointerId); } catch {}
    if (!aTouche) { aTouche = true; try { audio().resume?.(); } catch {} dire(IDEES.consigne); }
  });
  toile.addEventListener("pointermove", (e) => { if (doigt.actif) posDoigt(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => toile.addEventListener(t, () => (doigt.actif = false)));

  // ---- Création des bêtes ----
  const vueR = () => .5 * Math.hypot(L, H) / cam.z;
  function placeAutour(dans) {
    const R = vueR();
    const cap = Math.hypot(heros.vx, heros.vy) > 5 && alea() < .6 ? Math.atan2(heros.vy, heros.vx) + entre(-1.3, 1.3) : entre(0, 6.283);
    const d = dans ? entre(R * .35, R * .85) : entre(R * 1.05, R * 1.3);
    return [heros.x + Math.cos(cap) * d, heros.y + Math.sin(cap) * d];
  }
  function nouvelle(type, r, x, y, extra = {}) {
    const e = Object.assign({ type, r, x, y, vx: 0, vy: 0, cap: entre(0, 6.283), t: entre(0, 10), f: alea() < .5 ? 1 : -1, repos: 0, chasse: 0, peur: false, etaitDanger: false, alpha: 0, vit: entre(.8, 1.2) }, extra);
    ents.push(e); return e;
  }
  function creerProie(dans = false, dore = false, sp = choisir(ZONES[zone].proies)) {
    const [x, y] = placeAutour(dans);
    return nouvelle("proie", hr() * entre(.28, .5), x, y, { sp, dore: dore || (festin && alea() < .4) });
  }
  function creerBanc(cx, cy, cap, n, dore = false, sp = choisir(ZONES[zone].proies)) {
    for (let i = 0; i < n; i++) {
      const k = i / n, e = nouvelle("proie", hr() * entre(.26, .34), cx + Math.cos(cap + 1.57) * Math.sin(k * 6.28) * hr() * 1.4 - Math.cos(cap) * k * hr() * 7, cy + Math.sin(cap + 1.57) * Math.sin(k * 6.28) * hr() * 1.4 - Math.sin(cap) * k * hr() * 7, { sp, dore, banc: 1, cap });
      e.alpha = .3;
    }
  }
  function creerGros(tier, peur = false) {
    const q = alea(), ok = (k, autre) => (ANI_OK(k) ? k : autre);
    const esp = tier === 0 ? (q < .6 ? ok("delfin", "barracuda") : "barracuda")
      : tier === 2 ? (q < .7 ? ok("orca", "calamar") : "calamar")
      : q < .35 ? ok("pulpo", "dienton") : q < .7 ? ok("narval", "morena") : (MORENES ? "morena" : "dienton");
    const [x, y] = placeAutour(esp === "morena"); // la morena ne bouge pas : son trou apparaît près de lui
    const e = nouvelle("gros", TIERS[tier] * echelle() * entre(.97, 1.03), x, y, { esp, tier, peur, mode: "erre", mt: 0, ext: 0, cd: 1, dirA: 0 });
    e.etaitDanger = !peur && e.r > hr() * 1.05;
    return e;
  }
  function creerJefe() {
    const R = vueR(), cap = entre(0, 6.283);
    jefe = nouvelle("jefe", R_JEFE * echelle(), heros.x + Math.cos(cap) * R * 1.1, heros.y + Math.sin(cap) * R * 1.1);
    jefe.rBase = jefe.r; jefe.etaitDanger = true; jefe.nomT = 3.5;
    sonGrave(); vibrer(80);
    bulle(IDEES.jefe.charAt(0).toUpperCase() + IDEES.jefe.slice(1) + "!", 3000, true);
    dire(IDEES.jefeArrive(IDEES.jefe));
  }

  // ---- Les 15 premières secondes : écrites à la main, pareilles à chaque partie ----
  function ouverture() {
    if (tour > 0) return;
    const s = tJeu / 1000;
    if (ouvertureEtape === 0) { // un banc de sardines arrive droit sur lui : bouchées en rafale
      ouvertureEtape = 1;
      creerBanc(heros.x + vueR() * .55, heros.y - hr() * .5, Math.PI, 12, false, ZONES[0].proies[2]);
      for (let i = 0; i < 4; i++) creerProie(true);
      bulle(IDEES.geste, 3200);
    } else if (ouvertureEtape === 1 && s > 4.2) { // une ombre géante passe en dessous : la promesse du jefe
      ouvertureEtape = 2;
      sombra = { t: 0, dur: 5.5 };
      sonGrave(.16); vibrer(40);
      bulle(IDEES.sombra, 2600); dire(IDEES.sombra);
    } else if (ouvertureEtape === 2 && s > 7.5) { // un barracuda le repère : il fuit… puis le mange 10 s plus tard
      ouvertureEtape = 3;
      const e = creerGros(0); const cap = Math.atan2(heros.vy, heros.vx || 1) + .9;
      e.x = heros.x + Math.cos(cap) * vueR() * .75; e.y = heros.y + Math.sin(cap) * vueR() * .75;
      prochainDanger = tJeu + 6000;
    }
  }

  // ---- Les zones ----
  function changerZone(z) {
    zonePrec = zone; zone = z; zoneT = 0;
    bulle(IDEES.zones[z], 2600, true); dire(IDEES.zonesDit[z]); sonZone();
    for (let i = 0; i < 18; i++) eclats.jaillir(Math.random() * L, H + 10, "rgba(255,255,255,.7)", 1, 1.6, .6);
    const cap = entre(0, 6.283);
    creerBanc(heros.x + Math.cos(cap) * vueR() * .8, heros.y + Math.sin(cap) * vueR() * .8, cap + Math.PI, 10, z === ZONE_DOREE);
    if (z === ZONE_DOREE) setTimeout(() => !fini && bulle("¡Peces de oro!", 2000, true), 2700);
  }

  // ---- Grandir ----
  function grandir(facteur) {
    const cible = mCible(prog());
    // en avance sur le rythme : il grandit beaucoup moins (le jefe ne doit pas tomber trop tôt)
    const rattrapage = heros.m > cible * 1.2 && !jefe ? .2 : Math.pow(borne(cible / heros.m, .35, 3), 1.2);
    heros.m *= Math.exp(GAIN * facteur * rattrapage);
    if (jefeMange && dernierTour()) heros.m = Math.min(heros.m, m0 * M_TOUR * 3);
    while (tour === 0 && heros.niveau < 3 && heros.m >= SEUILS[heros.niveau + 1]) evoluer();
  }
  function evoluer() {
    heros.niveau++;
    ralenti = 1.1; heros.invul = Math.max(heros.invul, 1.6);
    anneaux.push({ t: 0 });
    sonEvolution(); vibrer(90);
    const [sx, sy] = ecran(heros.x, heros.y);
    eclats.jaillir(sx, sy, "#FFD34D", 26, 1.1); eclats.jaillir(sx, sy, "#FFFFFF", 14, 1.2);
    bulle(`¡Nivel ${heros.niveau + 1}!`, 2400, true);
    dire(IDEES.evolution(NOM));
    majBouton();
    setTimeout(() => { if (!fini) { const t = IDEES.nouveauPouvoir(IDEES.pouvoirs[heros.niveau]); bulle(t, 2600, true); dire(t); } }, 2600);
  }

  // ---- Manger ----
  const bouche = () => { const v = Math.hypot(heros.vx, heros.vy), R = hr(); return v > 20 ? [heros.x + heros.vx / v * R * 1.05, heros.y + heros.vy / v * R * 1.05] : [heros.x + heros.vers * R * 1.05, heros.y]; };
  function manger(e) {

    chargerPouvoir(e.pluie ? 0 : e.type === "gros" ? .3 : e.type === "jefe" ? 0 : .1); // ~10 bouchées ; la pluie de l'Ola dorada ne recharge pas

    if (sp.forme === "calamar") {
      g.strokeStyle = sp.c; g.lineCap = "round";
      for (let i = 0; i < 6; i++) { g.lineWidth = R * .16; const y0 = (i - 2.5) * R * .18; g.beginPath(); g.moveTo(-R * .6, y0); g.quadraticCurveTo(-R * 1.2, y0 + Math.sin(t * 4 + i) * R * .3, -R * 1.8, y0 * 1.6 + Math.sin(t * 4 + i + 1) * R * .3); g.stroke(); }
      g.lineWidth = lw; g.strokeStyle = ombre;
      g.fillStyle = sp.c; g.beginPath(); g.ellipse(R * .1, 0, R * 1.05, R * .8, 0, 0, 7); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(R * .9, -R * .5); g.lineTo(R * 1.5, 0); g.lineTo(R * .9, R * .5); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = sp.c2; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(-R * .3 + i * R * .3, -R * .35 + (i % 2) * R * .2, R * .09, 0, 7); g.fill(); }
    } else {
      g.fillStyle = sp.c;
      g.beginPath(); g.moveTo(-R * .9, 0); g.lineTo(-R * 1.55, -R * .65 + bat * R); g.lineTo(-R * 1.45, 0); g.lineTo(-R * 1.55, R * .65 + bat * R); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-R * .4, -R * .7); g.quadraticCurveTo(-R * .1, -R * 1.3, R * .35, -R * .75); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(0, 0, R * 1.15, R * .85, 0, 0, 7); g.fill(); g.stroke();
      g.fillStyle = sp.c2; g.beginPath(); g.ellipse(R * .15, R * .35, R * .8, R * .4, 0, 0, 7); g.fill();
    }
    const bx = R * .82, by = R * .2;
    if (humeur === "fache") { g.fillStyle = "#5A1E2E"; g.beginPath(); g.ellipse(bx, by, R * .3, R * .22 + Math.abs(bat) * R * .2, 0, 0, 7); g.fill(); if (sp.dents) dents(bx - R * .26, by - R * .2, R * .52, R * .16, 3); }
    else if (humeur === "peur") { g.fillStyle = "#5A1E2E"; g.beginPath(); g.ellipse(bx, by + R * .05, R * .11, R * .15, 0, 0, 7); g.fill(); }
    else { g.strokeStyle = "#5A1E2E"; g.lineWidth = Math.max(2, R * .07); g.beginPath(); g.arc(bx - R * .1, by - R * .05, R * .2, .3, 1.6); g.stroke(); }
    oeil(R * .45, -R * .3, R * .25, humeur);
    if (humeur === "fache") sourcil(R * .45, -R * .3, R * .25, R);
    if (humeur === "peur") sueur(R, t);
    g.restore();
  }

  // le jefe des abysses : énorme, sombre, une lanterne et des taches qui brillent. Aussi l'ombre de l'ouverture.
  function abisal(x, y, R, f, t, humeur, fatigue, silhouette) {
    const [c, c2, lum] = silhouette ? ["#000000", "#000000", "#FFE27A"] : JEFE_COUL;
    g.save(); g.translate(x, y); g.scale(f, 1);
    const bat = Math.sin(t * 4) * .2, ouvre = humeur === "fache" ? .5 + Math.abs(Math.sin(t * 3)) * .5 : humeur === "peur" ? .15 : .3;
    g.lineWidth = Math.max(2, R * .04); g.strokeStyle = silhouette ? "rgba(0,0,0,0)" : "rgba(0,0,0,.4)"; g.lineJoin = "round";
    g.fillStyle = c;
    g.beginPath(); g.moveTo(-R * 1.1, 0); g.lineTo(-R * 1.85, -R * .8 + bat * R); g.lineTo(-R * 1.6, 0); g.lineTo(-R * 1.85, R * .8 + bat * R); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-R * .6, -R * .75); g.lineTo(-R * .2, -R * 1.25); g.lineTo(R * .1, -R * .8); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(0, 0, R * 1.3, R * .9, 0, 0, 7); g.fill(); g.stroke();
    if (!silhouette) { g.fillStyle = c2; g.beginPath(); g.ellipse(R * .1, R * .4, R * .95, R * .4, 0, 0, 7); g.fill(); }
    // la grande gueule
    g.fillStyle = silhouette ? "#000" : "#3A0E1E";
    g.beginPath(); g.moveTo(R * 1.35, -R * .05); g.lineTo(R * .35, R * .05); g.lineTo(R * 1.35, R * (.15 + ouvre * .55)); g.closePath(); g.fill();
    if (!silhouette) { dents(R * .55, -R * .02, R * .8, R * .2, 5); dents(R * .55, R * (.12 + ouvre * .5), R * .8, -R * .18, 5); }
    // la lanterne
    g.strokeStyle = silhouette ? "#000" : c2; g.lineWidth = R * .06;
    g.beginPath(); g.moveTo(R * .4, -R * .8); g.quadraticCurveTo(R * 1, -R * 1.9, R * 1.6, -R * 1.25 + Math.sin(t * 2) * R * .08); g.stroke();
    g.fillStyle = lum; g.shadowColor = lum; g.shadowBlur = R * .7;
    g.beginPath(); g.arc(R * 1.6, -R * 1.2 + Math.sin(t * 2) * R * .08, R * .17, 0, 7); g.fill();
    // les taches qui brillent
    if (!silhouette) for (let i = 0; i < 5; i++) { g.globalAlpha *= 1; g.beginPath(); g.arc(-R * .8 + i * R * .32, -R * .1 + (i % 2) * R * .18, R * .06, 0, 7); g.fill(); }
    g.shadowBlur = 0;
    // l'œil
    const ex = R * .65, ey = -R * .38, er = R * .17;
    if (silhouette) { g.fillStyle = "#FFE27A"; g.shadowColor = "#FFE27A"; g.shadowBlur = 12; g.beginPath(); g.ellipse(ex, ey, er, er * .5, 0, 0, 7); g.fill(); g.shadowBlur = 0; }
    else if (fatigue && humeur !== "fache") { g.strokeStyle = "#FFE27A"; g.lineWidth = Math.max(2, R * .05); g.beginPath(); g.arc(ex, ey, er * .8, .2, 2.9); g.stroke(); }
    else if (humeur === "peur") oeil(ex, ey, er * 1.2, "peur");
    else { g.fillStyle = "#FFE27A"; g.beginPath(); g.arc(ex, ey, er, 0, 7); g.fill(); g.fillStyle = "#1E2A44"; g.beginPath(); g.ellipse(ex + er * .2, ey, er * .25, er * .8, 0, 0, 7); g.fill(); sourcil(ex, ey, er, R); }
    if (humeur === "peur" && !silhouette) sueur(R, t);
    if (fatigue && humeur !== "fache" && !silhouette) { g.scale(f, 1); g.fillStyle = "#fff"; g.font = `900 ${Math.max(14, R * .3)}px Lexend, system-ui`; g.fillText("z", R * .7 * f, -R * 1.1 - (t * 20) % 20); }
    g.restore();
  }

  function proie(e, x, y, R) {
    const sp = e.sp, t = e.t, c = e.dore ? "#FFD34D" : sp.c;
    if (sp.luz || e.dore) lueur(x, y, R * 2.4, e.dore ? "#FFD34D" : sp.luz, .45);
    g.save(); g.translate(x, y); g.scale(e.f, 1);
    g.lineWidth = Math.max(1.5, R * .08); g.strokeStyle = "rgba(0,0,0,.28)";
    if (sp.k === "pez") {
      const bat = Math.sin(t * 12) * .3;
      g.fillStyle = c;
      g.beginPath(); g.moveTo(-R * .7, 0); g.lineTo(-R * 1.3, -R * .55 + bat * R); g.lineTo(-R * 1.3, R * .55 + bat * R); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(0, 0, R * .95, R * .62, 0, 0, 7); g.fill(); g.stroke();
      if (!e.dore) { g.fillStyle = sp.c2; g.fillRect(-R * .25, -R * .58, R * .22, R * 1.16); }
      g.fillStyle = "#fff"; g.beginPath(); g.arc(R * .45, -R * .15, R * .2, 0, 7); g.fill(); g.fillStyle = "#1E2A44"; g.beginPath(); g.arc(R * .5, -R * .15, R * .1, 0, 7); g.fill();
    } else {
      g.strokeStyle = c; g.lineCap = "round"; g.lineWidth = R * .55;
      g.beginPath(); g.arc(0, -R * .1, R * .6, .3, 2.8); g.stroke();
      g.strokeStyle = "rgba(0,0,0,.3)"; g.lineWidth = Math.max(1, R * .06);
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-R * .3 + i * R * .3, R * .45); g.lineTo(-R * .35 + i * R * .3, R * .75 + Math.sin(t * 10 + i) * R * .08); g.stroke(); }
      g.beginPath(); g.moveTo(R * .55, 0); g.quadraticCurveTo(R * 1.1, -R * .6, R * 1.3, -R * .3); g.stroke();
      g.fillStyle = "#1E2A44"; g.beginPath(); g.arc(R * .5, -R * .05, R * .09, 0, 7); g.fill();
    }
    if (e.dore && Math.sin(t * 6) > .6) { g.fillStyle = "#fff"; g.beginPath(); g.arc(R * .4, -R * .6, R * .12, 0, 7); g.fill(); }
    g.restore();
  }

  // l'encre du calamar sur l'écran : ça fait rire, et ça part tout seul
  function tache(t) {
    const a = t.t < .15 ? t.t / .15 : Math.max(0, 1 - (t.t - .9) / 1.5);
    g.save(); g.globalAlpha = a * .6; g.fillStyle = "#2B1A40"; g.translate(t.x, t.y + t.t * 14);
    g.beginPath(); t.pts.forEach((k, i) => { const an = i / t.pts.length * 6.283; g.lineTo(Math.cos(an) * t.r * k, Math.sin(an) * t.r * k); }); g.closePath(); g.fill();
    g.restore();
  }

  // ---- La flèche vers le jefe quand il est hors de l'écran ----
  function flecheJefe() {
    if (!jefe) return;
    const [sx, sy] = ecran(jefe.x, jefe.y), m = 26;
    if (sx > -10 && sx < L + 10 && sy > -10 && sy < H + 10) return;
    const a = Math.atan2(sy - H / 2, sx - L / 2), k = Math.min((L / 2 - m) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - m) / Math.abs(Math.sin(a) || 1e-6));
    const x = L / 2 + Math.cos(a) * k, y = H / 2 + Math.sin(a) * k, ok = jefe.r < hr() * .95;
    g.save(); g.translate(x, y); g.rotate(a);
    g.fillStyle = ok ? "#6EF08C" : JEFE_COUL[2]; g.strokeStyle = "#fff"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(16, 0); g.lineTo(-10, -13); g.lineTo(-4, 0); g.lineTo(-10, 13); g.closePath(); g.fill(); g.stroke();
    g.restore();
  }

  // ---- La jauge en bas : les 4 niveaux, puis « assez grand pour le jefe ? » ----
  function jauge() {
    const w = Math.min(270, L * .72), x = (L - w) / 2, y = H - 40, h = 26;
    g.save(); g.fillStyle = "rgba(10,20,45,.6)"; rond(x, y, w, h, 13); g.fill();
    if (jefe) {
      const k = borne(hr() / (jefe.r / .95), 0, 1);
      g.fillStyle = k >= 1 ? "#6EF08C" : "#FFD34D"; rond(x + 4, y + 4, Math.max(18, (w - 8) * k), h - 8, 9); g.fill();
      abisal(x + w - 18, y + 13, 9, -1, jefe.t, k >= 1 ? "peur" : "fache", false, false);
    } else {
      const n = 4, pas = (w - 30) / (n - 1);
      let pr = 1;
      if (tour === 0 && heros.niveau < 3) pr = borne(Math.log(heros.m / SEUILS[heros.niveau]) / Math.log(SEUILS[heros.niveau + 1] / SEUILS[heros.niveau]), 0, 1);
      const niv = tour === 0 ? heros.niveau : 3;
      g.fillStyle = "#FFD34D"; rond(x + 15, y + 11, pas * (niv + (niv < 3 ? pr : 0)), 4, 2); g.fill();
      for (let i = 0; i < n; i++) etoile(x + 15 + i * pas, y + 13, i <= niv ? 10 : 7, i <= niv ? "#FFD34D" : "rgba(255,255,255,.35)");
    }
    g.restore();
  }
  function rond(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
  function etoile(x, y, r, c) { g.fillStyle = c; g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }

  function indiceDoigt() {
    const t = performance.now() / 1000, [hx, hy] = ecran(heros.x, heros.y);
    const k = (t % 1.6) / 1.6, x = hx + L * .1 + k * L * .18, y = hy + H * .1 - k * H * .06;
    g.save(); g.globalAlpha = .9 - k * .5;
    g.fillStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.arc(x, y, 18, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 18 + k * 14, 0, 7); g.stroke();
    g.restore();
  }

  // Pour les tests
  window.devora = {
    pouvoir: () => { const p = pouvoirPret; lancerPouvoir(); return p; },
    etat: () => ({ tJeu: Math.round(tJeu), tour, p: +prog().toFixed(2), zone, m: +heros.m.toFixed(2), niveau: heros.niveau, bouchees, jefe: !!jefe, jefeMange, festin, fini, pret: pouvoirPret, ents: ents.length,
      types: ents.reduce((o, e) => { const k = e.esp || e.type; o[k] = (o[k] || 0) + 1; return o; }, {}) }),
    evoluer: () => evoluer(),
    // l'écran où se trouve la bête mangeable la plus proche (pour un joueur automatique)
    cible: () => {
      const R = hr(); let best = null, bd = 1e9;
      for (const e of ents) {
        if (e.mort || !mangeablePar(e, R)) continue;
        const [cx, cy] = contact(e), d = Math.hypot(cx - heros.x, cy - heros.y) - (e.type === "proie" ? 0 : e.type === "jefe" ? R * 6 : R * 3);
        if (d < bd) { bd = d; best = [cx, cy]; }
      }
      if (!best) return null;
      const r = toile.getBoundingClientRect(), [x, y] = ecran(best[0], best[1]);
      return { x: r.left + borne(x, 10, L - 10), y: r.top + borne(y, 10, H - 10) };
    },
  };
})();
</script>
