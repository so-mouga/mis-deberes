<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2347A8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Deberes de hoy</title>
<link rel="preload" href="assets/fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=10">
<style>
  /* Accueil réduit à l'essentiel (25 nov. 2026) : le thème, le gros bouton, ses animaux. Rien ne défile. */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
  .ecran{height:100dvh;min-height:0;overflow:hidden}
  header{display:flex;align-items:center;gap:12px}
  h1{flex:1;font-weight:850;font-size:clamp(28px,8.2vw,34px);letter-spacing:-.02em;line-height:1.05}
  .centre{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:28px}
  .lecon{background:var(--page-fonce);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
  .lecon .bandeau{font-size:26px;line-height:1.2}
  .lecon p{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:19px;font-weight:700;color:var(--encre-douce)}
  .mini-sobre{width:26px;height:32px;border-radius:4px;flex:none;background:linear-gradient(135deg,var(--rouge) 0 50%,var(--jaune) 50%)}
  .centre .gros{min-height:92px;font-size:34px}
  /* Les histoires du soir (26 nov. 2026) : discrètes le jour ; à partir de 19 h 30, mises en avant (en premier si les devoirs sont faits). */
  .noche{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:22px;font-size:17px;font-weight:700;color:var(--encre-douce);background:rgba(16,23,46,.35);white-space:nowrap;gap:8px}
  .noche.soir{min-height:64px;border-radius:32px;font-size:23px;font-weight:850;color:#ECE5D3;background:#10172E;box-shadow:0 6px 0 #070B19}
  .centre:has(.noche){gap:18px}
  .centre:has(.noche.soir){gap:14px}
  .centre:has(.noche.soir) .gros{min-height:76px;font-size:30px}
  .centre:has(.noche.soir) .lecon{padding:14px 16px;gap:10px}
  .animales{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:20px;padding:10px 14px}
  .animales b{flex:1;font-size:19px;font-weight:800}
  .animales b small{display:block;font-size:15px;font-weight:600;color:var(--encre-douce)}
  .animales .derniers{display:flex}
  .animales .derniers .cromo{width:48px;padding:3px;margin-left:-12px;border-radius:8px}
  .animales .derniers .cromo .provisoire{font-size:9px}
  /* Les jeux (25 nov. 2026) : ouverts après les devoirs du jour, ou par un adulte (un calcul) */
  .centre .jugar{min-height:72px;font-size:28px}
  .cerrado{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:28px;border:3px dashed rgba(255,255,255,.3);color:var(--encre-douce);font-size:18px;font-weight:700;background:none;font-family:inherit;width:100%}
  .cerrado svg{width:22px;height:22px;flex:none}
  .gate{position:fixed;inset:0;z-index:10;background:rgba(15,25,60,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  .gate[hidden]{display:none}
  .gate h2{font-size:24px;font-weight:850}
  .gate p{font-size:17px;color:var(--encre-douce);max-width:28ch;line-height:1.35}
  .gate .calc{font-size:34px;font-weight:900}
  .gate input{width:150px;font:inherit;font-size:32px;font-weight:800;text-align:center;border-radius:16px;border:3px solid #fff;padding:8px;color:var(--marine)}
  .gate input.faux{animation:non .35s}
  @keyframes non{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .gate .gros{max-width:320px}
</style>
</head>
<body>
<main class="ecran">
  <header>
    <h1>¡Hola, Dorian!</h1>
    <button class="rond" id="ecouter" aria-label="Escuchar"></button>
  </header>

  <div class="centre">
    <section class="lecon">
      <span class="bandeau" id="bandeau"></span>
      <p>≈ 10 min · y luego tu sobre <span class="mini-sobre" aria-hidden="true"></span></p>
    </section>
    <a class="gros" id="go">¡A los deberes!</a>
    <div id="juegos"></div>
    <a class="noche" id="noche" href="historias.html">🌙 Historia de esta noche</a>
  </div>

  <a class="animales" href="album-animales.html"><b>Mis animales<small id="compte"></small></b><span class="derniers" id="derniers"></span></a>
</main>

<!-- Pour un adulte : ouvrir les jeux pour la journée (jour sans devoirs, week-end…). Un calcul que Dorian ne sait pas encore faire. -->
<section class="gate" id="gate" hidden>
  <h2>Para papá o mamá</h2>
  <p>Los juegos se abren después de los deberes. Para abrirlos hoy, resuelve:</p>
  <span class="calc" id="calc"></span>
  <input id="rep" type="number" inputmode="numeric" autocomplete="off" aria-label="Resultado">
  <button class="gros" id="valider">Abrir los juegos hoy</button>
  <button class="gros clair" id="annuler">Cancelar</button>
</section>

<script src="commun.js?v=11"></script>
<script src="lecons.js?v=14"></script>
<script src="maths.js?v=15"></script>
<script src="animaux.js?v=12"></script>
<script src="sync.js?v=8"></script>
<script src="deberes.js?v=6"></script>
<script>const NE_PAS_VERROUILLER = true;</script>
<script src="pause-commun.js?v=4"></script>
<script>
  // La séance du jour est choisie par deberes.js (réglages des parents, contrôles, Repaso) ; ?lecon=X l'impose.
  const DEMANDEE = new URLSearchParams(location.search).get("lecon");
  const $ = (id) => document.getElementById(id);
  $("ecouter").innerHTML = ICONES.hautparleur;
  function afficherAnimaux() {
    const mes = collection();
    $("compte").textContent = `${mes.length} de ${ANIMAUX.length}`;
    $("derniers").innerHTML = "";
    mes.slice(-3).forEach((n) => $("derniers").append(cromoAnimal(ANIMAUX.find((a) => a.n === n), { noms: false })));
  }
  afficherAnimaux();

  // Les jeux : « ¡A jugar! » une fois la séance du jour finie (ou ouverts par un adulte), sinon un bouton fermé.
  const CADENAS = `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;
  function afficherJuegos() {
    $("juegos").innerHTML = juegosAbiertos()
      ? `<a class="gros vert jugar" href="juegos.html">¡A jugar!</a>`
      : `<button class="cerrado" id="cerrado">${CADENAS}Juegos: después de los deberes</button>`;
    if ($("cerrado")) $("cerrado").addEventListener("click", ouvrirGate);
  }
  afficherJuegos();
  function afficherNoche() {
    const d = new Date(), soir = d.getHours() * 60 + d.getMinutes() >= 19 * 60 + 30 || new URLSearchParams(location.search).has("noche");
    $("noche").classList.toggle("soir", soir);
    if (soir && juegosAbiertos()) $("go").before($("noche")); // devoirs faits : l'histoire d'abord
  }
  afficherNoche();
  let attendu;
  function nouveauCalcul() {
    const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4), c = 11 + Math.floor(Math.random() * 30);
    attendu = a * b + c;
    $("calc").textContent = `${a} × ${b} + ${c} = ?`;
    $("rep").value = "";
  }
  function ouvrirGate() {
    dire("Los juegos se abren después de los deberes. ¡Primero, a los deberes!");
    nouveauCalcul(); $("gate").hidden = false;
  }
  $("annuler").addEventListener("click", () => { $("gate").hidden = true; });
  $("valider").addEventListener("click", () => {
    if (+$("rep").value === attendu) { ouvrirJuegosHoy(); $("gate").hidden = true; afficherJuegos(); sonBien(); return; }
    $("rep").classList.remove("faux"); void $("rep").offsetWidth; $("rep").classList.add("faux");
    setTimeout(nouveauCalcul, 400);
  });

  let ID;
  function afficher() {
    ID = LECONS[DEMANDEE] ? DEMANDEE : Deberes.leconDuJour().id;
    const L = LECONS[ID];
    $("bandeau").textContent = L.titre;
    $("go").href = "seance.html?lecon=" + ID;
  }
  afficher();
  $("ecouter").addEventListener("click", () =>
    dire(`¡Hola Dorian! Hoy: ${LECONS[ID].titre}. Al terminar, abrirás un sobre con un animal sorpresa. Toca: a los deberes.`));

  // Synchronisation : une séance restée en attente part, et les réglages des parents arrivent (sans rien bloquer).
  // La progression (cromos, leçons faites, points à revoir) est fusionnée avec celle des autres téléphones de Dorian.
  function synchroniser() {
    Deberes.recuperer();
    Sync.vider();
    Promise.all([
      Sync.rafraichirAjustes().catch((err) => { console.warn("Ajustes:", err.message); return null; }),
      Sync.synchroniserProgreso(),
    ]).then(([a, p]) => {
      if (p) { Deberes.reconstruireRepaso(); afficherAnimaux(); afficherJuegos(); }
      if (a || p) afficher();
    });
  }

  // Brancher un nouvel appareil avec le lien (ou le QR code) créé sur la page des parents : …#conectar=…&nombre=…
  const H = new URLSearchParams(location.hash.slice(1));
  if (H.get("conectar")) {
    history.replaceState(null, "", location.pathname + location.search); // la clé ne reste pas dans l'adresse
    Sync.brancher(H.get("conectar"), H.get("nombre") || "")
      .then(() => { alert("¡Listo! Este móvil está conectado" + (H.get("nombre") ? ": " + H.get("nombre") : "") + ". Los cromos y los deberes de Dorian llegarán solos."); synchroniser(); })
      .catch((err) => alert("No se pudo conectar: " + err.message + ". Prueba otra vez con conexión."));
  } else synchroniser();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { Sync.vider(); Sync.synchroniserProgreso(); } });

  // Brancher ce téléphone sur le Google Sheet : appui long (2 s) sur « ¡Hola, Dorian! ». Rien de visible pour Dorian.
  let appui;
  const titre = document.querySelector("h1");
  titre.addEventListener("pointerdown", () => { appui = setTimeout(conectar, 2000); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => titre.addEventListener(ev, () => clearTimeout(appui)));
  titre.addEventListener("contextmenu", (ev) => ev.preventDefault());
  async function conectar() {
    const ya = Sync.lien();
    const texte = prompt((ya ? "Este teléfono ya está conectado.\n" : "") + "Pega el enlace del script de Google (termina en /exec#clave):");
    if (!texte) return;
    const nombre = prompt("¿Cómo se llama este móvil? (por ejemplo: móvil de Dorian, móvil de la abuela)", ya?.nombre || "móvil de Dorian");
    try { await Sync.brancher(texte, nombre || ""); alert("Conectado. Los ajustes de papá y mamá llegarán solos."); synchroniser(); }
    catch (err) { alert("No se pudo conectar: " + err.message + "."); }
  }
</script>
</body>
</html>
