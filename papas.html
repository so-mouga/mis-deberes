<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D3A33">
<meta name="robots" content="noindex,nofollow">
<title>Deberes de Dorian · papás</title>
<link rel="preload" href="assets/fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Espace parent v2 (26 nov. 2026) : un admin sobre, bilingue, en une colonne. Pas l'univers de Dorian. */
@font-face{font-family:"Lexend";font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/fonts/lexend-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Lexend";font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/fonts/lexend-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  color-scheme:light dark;
  --fond:#F3F5F3; --surface:#FFFFFF; --surface-2:#EEF2EF; --trait:#DDE3DF; --trait-fort:#BFC9C3;
  --encre:#17201C; --encre-2:#4A5751; --encre-3:#6B7872;
  --rail:#1D3A33; --rail-encre:#D6E4DE; --rail-actif:#2C5248;
  --accent:#1F5D4F; --accent-encre:#FFFFFF; --accent-doux:#DDEBE5;
  --vert:#23784C; --vert-fond:#E0F1E6; --orange:#A15C00; --orange-fond:#FBEBD2; --bleu:#45608A;
  --rouge:#B3261E; --rouge-fond:#FBE4E1;
}
@media (prefers-color-scheme:dark){
  :root{
    --fond:#101614; --surface:#18201D; --surface-2:#1F2925; --trait:#2A3530; --trait-fort:#3A4842;
    --encre:#E6EEEA; --encre-2:#AEBCB6; --encre-3:#8A9993;
    --rail:#0C1311; --rail-encre:#AFC2BA; --rail-actif:#1F3A33;
    --accent:#5FB89A; --accent-encre:#0C1311; --accent-doux:#1C3A31;
    --vert:#6CCB93; --vert-fond:#173326; --orange:#F0B45C; --orange-fond:#3A2A12; --bleu:#9DB5DA;
    --rouge:#F2938B; --rouge-fond:#3B1C1A;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Lexend",system-ui,sans-serif;font-size:16px;line-height:1.45;background:var(--fond);color:var(--encre)}
::selection{background:var(--accent-doux)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Écrans d'entrée (lien du script, code) ---------- */
.entree{max-width:420px;margin:0 auto;padding:max(48px,10vh) 20px 40px;display:flex;flex-direction:column;gap:14px}
.entree .marque-e{font-size:14px;font-weight:600;color:var(--encre-2)}
.entree h1{font-size:26px;font-weight:700;letter-spacing:-.015em}
.entree p{color:var(--encre-2)}
.entree textarea{font-size:14px;background:var(--surface);border:1px solid var(--trait-fort);border-radius:12px;padding:12px;min-height:110px;resize:vertical;word-break:break-all}
input.code{width:100%;text-align:center;font-size:32px;font-weight:700;letter-spacing:.5em;-webkit-text-security:disc;min-height:64px;background:var(--surface);border:1px solid var(--trait-fort);border-radius:12px}
.message{min-height:22px;font-size:15px;font-weight:600;color:var(--rouge)}
.entree .langue-e{display:flex;gap:6px}

/* ---------- La coquille : menu à gauche (PC), onglets en bas (mobile) ---------- */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
.rail{background:var(--rail);color:var(--rail-encre);display:flex;flex-direction:column;gap:4px;padding:20px 12px;position:sticky;top:0;height:100dvh}
.rail .marque{padding:4px 10px 18px;color:#fff;font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--rail-encre);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current=page]{background:var(--rail-actif);color:#fff;font-weight:600}
.rail .pied{margin-top:auto;padding:0 10px;display:flex;flex-direction:column;gap:12px}
.etat-sync{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3}
.etat-sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rail-encre);flex:none}
.etat-sync.ok::before{background:#58C98A}
.etat-sync.attente::before{background:#F2B90F}
.etat-sync.erreur::before{background:#F2938B}
.etat-sync button{text-decoration:underline;font-weight:600;color:#fff}
.langue{display:inline-flex;border:1px solid rgba(255,255,255,.2);border-radius:8px;overflow:hidden;align-self:flex-start}
.langue button{padding:4px 10px;font-size:13px;font-weight:600;color:var(--rail-encre)}
.langue button[aria-pressed=true]{background:rgba(255,255,255,.16);color:#fff}
.barre,.onglets{display:none}

main{min-width:0;padding:32px 40px 56px}
.page{max-width:620px}
h1{font-size:26px;font-weight:700;letter-spacing:-.015em;margin-bottom:20px}
h2{font-size:15px;font-weight:600;color:var(--encre-2);margin:28px 0 10px}
.intro{color:var(--encre-2);margin:-8px 0 18px}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--trait-fort);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-encre)}
.btn[disabled]{opacity:.5;cursor:default}
.lien{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
select,input[type=date],input[type=text]{min-height:44px;border-radius:10px;border:1px solid var(--trait-fort);background:var(--surface);padding:0 12px;min-width:0}
.petit{font-size:13.5px;color:var(--encre-3);margin-top:10px}
.rien{color:var(--encre-2);padding:14px 18px}

/* Ce soir */
.cesoir{padding:20px}
.cesoir .lab{font-size:14px;color:var(--encre-2)}
.cesoir .quoi{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
.cesoir p{color:var(--encre-2)}
.cesoir .lien{display:inline-block;margin-top:12px}
.cesoir select{width:100%;margin-top:12px}

/* Les jours (planning et semaine) */
.semaine{padding:16px 16px 14px}
.semaine .tete{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.semaine .tete b{font-weight:600}
.nav-s{display:flex;gap:4px}
.nav-s button{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--encre-2)}
.nav-s button:hover{background:var(--surface-2)}
.nav-s button[disabled]{opacity:.3;cursor:default}
.sem{display:block;font-size:13px;color:var(--encre-2);margin:2px 0 6px}
.jours7 + .sem{margin-top:12px}
.jours7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.jour{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:10px;background:var(--surface-2);min-width:0}
.jour .jn{font-size:12.5px;color:var(--encre-2)}
.jour .jd{font-size:16px;font-weight:700}
.jour .mq{height:22px;display:grid;place-items:center;font-size:18px;font-weight:700;line-height:1}
.jour .pv{height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--encre-2);line-height:1;max-width:100%;overflow:hidden}
.jour .pv.n2{font-size:11px}
.jour .pv.auto{color:var(--encre-3);font-weight:500}
.jour.fait{background:var(--vert-fond);color:var(--vert)}
.jour.fait .jn{color:var(--vert)}
.jour.commence{background:var(--orange-fond);color:var(--orange)}
.jour.commence .jn{color:var(--orange)}
.jour.rien .mq{color:var(--encre-3)}
.jour.futur{background:none;border:1px dashed var(--trait);color:var(--encre-3)}
.jour.auj{box-shadow:inset 0 0 0 2px var(--encre)}
.jour[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.phrase{margin-top:12px;font-size:15px}
.phrase b{font-weight:600}
.plan-jour{margin-top:12px;padding:12px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.plan-jour p{font-size:14px;color:var(--encre-2)}
.puces{display:flex;gap:8px;flex-wrap:wrap}
.puce{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--trait-fort);background:var(--surface);font-weight:600}
.puce[aria-pressed=true]{background:var(--vert);border-color:var(--vert);color:#fff}

/* Listes */
.liste{list-style:none}
.liste > li{border-top:1px solid var(--trait)}
.liste > li:first-child{border-top:0}
.ligne{display:flex;align-items:center;gap:12px;padding:14px 18px}
.ligne .t{flex:1;min-width:0}
.ligne .t b{display:block;font-weight:600}
.ligne .t small{display:block;color:var(--encre-2);font-size:14px}
.ligne .q{font-size:14px;color:var(--encre-2);white-space:nowrap;text-align:right}

/* Leçons : une carte par matière */
.matiere{padding:16px 18px;margin-bottom:16px}
.tete-m{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.tete-m b{font-size:18px;font-weight:700}
.tete-m span{font-size:14px;color:var(--encre-2)}
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-weight:600}
.champ .rang{display:flex;gap:8px;flex-wrap:wrap}
.champ .rang input{flex:1 1 160px}
.champ p{font-size:14px;color:var(--encre-2)}
.champ.ex{padding-bottom:14px;border-bottom:1px solid var(--trait);margin-bottom:6px}
.prog{list-style:none}
.prog label{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer}
.prog input{appearance:none;width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--trait-fort);background:var(--surface);display:grid;place-items:center;cursor:pointer;margin:0}
.prog input:checked{background:var(--accent);border-color:var(--accent)}
.prog input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-encre);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.prog span{flex:1;min-width:0}
.prog span i{display:block;font-style:normal;font-size:13px;color:var(--encre-3)}
.prog li:has(input:not(:checked)) span{color:var(--encre-2)}
.prog small{font-size:13.5px;color:var(--encre-3);white-space:nowrap}
.prog small.sait{color:var(--vert);font-weight:600}
.pied-m{padding-top:6px}
.pied-m .lien{font-size:14px}

/* Semaine (suivi) */
.seance{padding:14px 18px;border-top:1px solid var(--trait)}
.seance:first-child{border-top:0}
.seance .h{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--encre-2)}
.seance .t{font-weight:600;margin:2px 0}
.seance .r{font-size:14px;color:var(--encre-2)}
.seance .r b{color:var(--encre);font-weight:500}
.seance .a{font-size:13px;color:var(--encre-3)}
.seance.regalo .t{color:var(--accent)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--orange-fond);color:var(--orange);margin-left:6px;vertical-align:1px}

/* Réglages */
.reglage{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-top:1px solid var(--trait)}
.reglage:first-child{border-top:0}
.reglage .lib{font-weight:500}
.reglage small{color:var(--encre-2);font-size:14px;white-space:nowrap}
.inter{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--trait-fort);position:relative;cursor:pointer;flex:none;margin:0}
.inter::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.inter:checked{background:var(--accent)}
.inter:checked::after{transform:translateX(18px)}
.choix-l{display:inline-flex;border:1px solid var(--trait-fort);border-radius:10px;overflow:hidden}
.choix-l button{padding:8px 12px;font-size:14px;font-weight:600;color:var(--encre-2)}
.choix-l button[aria-pressed=true]{background:var(--accent-doux);color:var(--accent)}
.choix-l.col{display:flex;flex-direction:column;margin-top:8px}
.choix-l.col button{text-align:left;padding:11px 14px}
.choix-l.col button + button{border-top:1px solid var(--trait)}
.choix-l.col button[aria-pressed=true]::before{content:"✓ "}
.danger{color:var(--rouge)}
.ajout{padding:14px 18px;border-top:1px solid var(--trait);display:flex;flex-direction:column;gap:10px}
.ajout .rang{display:flex;gap:8px}
.ajout input{flex:1}
.qr{align-self:center;background:#fff;border-radius:14px;padding:12px;line-height:0}
.qr svg{width:200px;height:200px}
.lienBranchement{font-size:12px;color:var(--encre-3);word-break:break-all}

@media (max-width:760px){
  .app{display:block}
  .rail{display:none}
  .barre{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5;background:var(--rail);color:#fff;padding:max(10px,env(safe-area-inset-top)) 16px 10px}
  .barre b{display:none}
  .barre .droite{display:flex;align-items:center;gap:10px;min-width:0}
  .barre .etat-sync{color:var(--rail-encre);font-size:12.5px;min-width:0}
  .barre .etat-sync span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .onglets{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--trait);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
  .onglets a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--encre-3);text-decoration:none;min-width:0}
  .onglets a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .onglets a[aria-current=page]{color:var(--accent)}
  .onglets .ic{width:22px;height:22px}
  main{padding:18px 16px calc(84px + env(safe-area-inset-bottom))}
  h1{font-size:22px;margin-bottom:14px}
  .ligne,.seance,.reglage,.ajout{padding-left:14px;padding-right:14px}
  .jours7{gap:4px}
  .semaine{padding:14px 12px 12px}
  .matiere{padding:14px}
  .reglage{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 1. Première ouverture sur ce téléphone : le lien du script -->
<section class="entree" id="ecranLien" hidden>
  <span class="marque-e" data-t="marque"></span>
  <h1 data-t="lienTitre"></h1>
  <p data-t="lienTexte"></p>
  <textarea id="champLien" placeholder="https://script.google.com/macros/s/…/exec#…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <p class="message" id="msgLien" role="alert"></p>
  <button class="btn prim" id="okLien" data-t="connecter"></button>
  <div class="langue-e choix-l" role="group" aria-label="Langue / Idioma"><button data-l="fr">Français</button><button data-l="es">Español</button></div>
</section>

<!-- 2. Le code à 4 chiffres (le choisir la première fois, puis le taper) -->
<section class="entree" id="ecranCode" hidden>
  <span class="marque-e" data-t="marque"></span>
  <h1 id="titreCode"></h1>
  <p id="texteCode"></p>
  <input class="code" id="champCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
  <p class="message" id="msgCode" role="alert"></p>
  <button class="lien" id="oubli" data-t="oubli" style="align-self:flex-start"></button>
  <div class="langue-e choix-l" role="group" aria-label="Langue / Idioma"><button data-l="fr">Français</button><button data-l="es">Español</button></div>
</section>

<!-- 3. L'espace parent -->
<div class="app" id="contenu" hidden>
  <nav class="rail" aria-label="Menu">
    <div class="marque" data-t="marque"></div>
    <div class="nav" id="nav"></div>
    <div class="pied">
      <span class="etat-sync" aria-live="polite"></span>
      <div class="langue" role="group" aria-label="Langue / Idioma"><button data-l="fr">FR</button><button data-l="es">ES</button></div>
    </div>
  </nav>
  <header class="barre">
    <b data-t="marque"></b>
    <div class="droite"><span class="etat-sync"></span><div class="langue" role="group" aria-label="Langue / Idioma"><button data-l="fr">FR</button><button data-l="es">ES</button></div></div>
  </header>
  <main id="main"></main>
  <nav class="onglets" id="onglets" aria-label="Menu"></nav>
</div>

<script src="lecons.js?v=14"></script>
<script src="maths.js?v=15"></script>
<script src="sync.js?v=7"></script>
<script src="deberes.js?v=7"></script>
<script>
  // ================= Textes (français / espagnol) : aucun texte en dur ailleurs =================

  const CLE_LANGUE = "dorian.papas.idioma";

  const quand = (j) => { const n = Deberes.ecart(hoy(), j); return n === 0 ? t("auj") : n === 1 ? t("demain") : n === -1 ? t("hier") : n > 1 && n < 7 ? t("joursL")[new Date(j + "T12:00").getDay()] : date(j); };
  const heure = (iso) => new Date(iso).toLocaleTimeString(LANGUE === "fr" ? "fr-FR" : "es-ES", { hour: "2-digit", minute: "2-digit" });

  const REPASO = Deberes.REPASO;
  const matiere = Deberes.matiereDe;
  const LISTE = Object.keys(LECONS).filter((k) => k !== REPASO && MAT.includes(matiere(k)));

  const titreComplet = (k) => (MAT.includes(matiere(k)) ? `${t(matiere(k))} · ${nomLecon(k)}` : LECONS[k]?.titre || k);

  // Le code n'est jamais gardé en clair : une empreinte, salée par la clé du script (barrière d'écran seulement).
  function empreinte(code) {
    const s = "dorian|" + (Sync.lien()?.cle || "") + "|" + code;
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return "f1:" + h.toString(16);
  }

  // ================= État de la synchronisation =================

  function etat(classe, texte, reessayer = false) {
    etatSync = { classe, texte, reessayer };

      e.className = "etat-sync " + classe;

  // ================= Enregistrer : chaque changement part tout de suite, et attend s'il n'y a pas de réseau =================

      ecrireLocal(PENDIENTE, Object.keys(reste).length ? reste : null);
      A = { ...recu, ...reste };

  // Une copie modifiable des « temas » (on ne touche jamais l'objet reçu).
  const copieTemas = () => JSON.parse(JSON.stringify(A.temas || {}));
  // La date d'examen d'une matière : celle saisie ici, sinon (anciens réglages) celle des leçons. Vide si passée.
  function examenMatiere(m, temas = A.temas || {}) {
    let d = (temas.__examenes || {})[m];
    if (d === undefined) d = leconsDe(m).map((k) => (temas[k] || {}).control).filter(Boolean).sort().pop() || "";

    const temas = copieTemas();
    temas.__examenes = { ...(temas.__examenes || {}), [m]: d };

  }

    ids.forEach((k) => {

    changer({ temas });
  }
  function changerPlan(d, m) {

    const plan = {};

    const ms = plan[d] || [];

  // Les leçons faites : la progression partagée des téléphones de Dorian, complétée par le suivi (la date la plus récente).
  const hechasSuivi = () => {
    const h = { ...((P && P.hechas) || {}) };
    [...S].reverse().forEach((s) => { if (s.terminada && !(h[s.leccion] > s.fecha)) h[s.leccion] = s.fecha; });
    return h;
  };
  // « Il le sait » : ses 2 dernières séances sont finies, avec au plus 1 erreur chacune.
  function sait(k) {
    const ss = S.filter((s) => s.leccion === k).slice(0, 2);
    if (!ss.length) return null;
    return ss.length === 2 && ss.every((s) => s.terminada && s.fallos.reduce((n, f) => n + (f.n || 1), 0) <= 1);
  }
  const etiquetteFallo = (f) => (f.tipo === "mates" ? { "total/diferencia": t("m_total"), "sumar/restar": t("m_signe"), unidades: t("m_unites"), decenas: t("m_dizaines"), palitos: t("m_palitos") }[f.txt] || f.txt : f.txt);

  // ================= Aujourd'hui =================
  function rangee(lundi, mode) {
    const plan = (A.temas || {}).__plan || {};
    return [0, 1, 2, 3, 4, 5, 6].map((i) => {
      const d = plus(lundi, i), ss = S.filter((s) => s.fecha === d);
      const st = ss.some((s) => s.terminada) ? "fait" : ss.length ? "commence" : d > hoy() ? "futur" : "rien";
      const pv = (plan[d] || []).map((m) => t("court_" + m));
      let mq;
      if (st === "fait") mq = `<span class="mq">✓</span>`;
      else if (st === "commence") mq = `<span class="mq">½</span>`;
      else if (mode === "plan" && d >= hoy()) mq = pv.length ? `<span class="pv${pv.length > 1 ? " n2" : ""}">${pv.length > 2 ? pv.map((x) => x[0]).join(" ") : pv.join("+")}</span>` : `<span class="pv auto">${t("autoCourt")}</span>`;
      else if (d > hoy()) mq = `<span class="mq"></span>`;
      else mq = `<span class="mq">–</span>`;
      const etiquette = `${date(d)}`;
      const attr = mode === "plan" && d >= hoy() && st !== "fait" ? `data-pj="${d}" aria-pressed="${jourPlan === d}"` : `data-j="${d}" aria-pressed="${jourVu === d}"`;

    }).join("");
  }

    }

      ? `<select id="forcer" aria-label="${t("changer")}"><option value="">${t("auto")}</option>${MAT.map((m) => `<optgroup label="${t(m)}">${leconsDe(m).map((k) => `<option value="${k}"${k === f ? " selected" : ""}>${echap(nomLecon(k))}</option>`).join("")}</optgroup>`).join("")}</select>`
      : `<button class="lien" data-forcer>${t("changer")}</button>`;
    const l0 = lundiDe(hoy());
    const jp = jourPlan && jourPlan >= hoy() ? jourPlan : null;
    const ms = jp ? ((A.temas || {}).__plan || {})[jp] || [] : [];
    const panneau = jp
      ? `<div class="plan-jour"><b>${date(jp)}</b><div class="puces">${MAT.map((m) => `<button class="puce" data-pm="${m}" aria-pressed="${ms.includes(m)}">${t(m)}</button>`).join("")}</div><p>${ms.length ? t("planN", ms.length) : t("planAuto")}</p></div>`
      : `<p class="petit">${t("planAide")}</p>`;
    const venir = MAT.map((m) => ({ m, d: examenMatiere(m) })).filter((x) => x.d).sort((a, b) => a.d.localeCompare(b.d));
    const ph = resume(l0);
    return `<h1>${t("hoy")}</h1>
      <section class="carte cesoir">${cesoir}${choix}</section>
      <h2>${t("planTitre")}</h2>
      <section class="carte semaine">
        <span class="sem">${t("cetteSem")}</span><div class="jours7">${rangee(l0, "plan")}</div>
        <span class="sem">${t("semProch")}</span><div class="jours7">${rangee(plus(l0, 7), "plan")}</div>
        ${panneau}${ph ? `<p class="phrase">${ph}</p>` : ""}
      </section>
      <h2>${t("aVenir")}</h2>
      ${venir.length ? `<ul class="carte liste">${venir.map((v) => `<li><div class="ligne"><span class="t"><b>${t("examen")} · ${t(v.m)}</b><small>${t("themesN", leconsDe(v.m).filter((k) => auProgramme(k) && !Deberes.estMelange(k)).length)}</small></span><span class="q">${quand(v.d)}</span></div></li>`).join("")}</ul>` : `<p class="carte rien">${t("rienAVenir")}</p>`}`;
  }

  // ================= Leçons =================
  function pageLecons() {
    let h = `<h1>${t("lecons")}</h1><p class="intro">${t("lecIntro")}</p>`;
    MAT.forEach((m) => {
      const ls = leconsDe(m);
      if (!ls.length) return;
      const dans = ls.filter((k) => auProgramme(k)), ex = examenMatiere(m);
      h += `<section class="carte matiere"><div class="tete-m"><b>${t(m)}</b><span>${t("nbProg", dans.length, ls.length)}</span></div>
        <div class="champ ex"><label for="ex-${m}">${t("examenMat")}</label><div class="rang"><input type="date" id="ex-${m}" data-ex="${m}" value="${ex}" min="${hoy()}"></div>${ex ? `<p>${t("examenAide", quand(ex))}</p>` : ""}</div>
        <ul class="prog">${ls.map((k) => {
          const on = auProgramme(k), s = sait(k), mel = Deberes.estMelange(k);
          const info = mel ? `<small>${t("melange")}</small>` : !on ? "" : s === true ? `<small class="sait">${t("sait")}</small>` : s === null ? `<small>${t("pasFaite")}</small>` : `<small>${t("revoir")}</small>`;
          const unite = LECONS[k].unidad ? `<i>${echap(LECONS[k].unidad)}</i>` : "";
          return `<li><label><input type="checkbox" data-prog="${k}"${on ? " checked" : ""}><span>${echap(nomLecon(k))}${unite}</span>${info}</label></li>`;
        }).join("")}</ul>
        <div class="pied-m"><button class="lien" data-tout="${m}">${dans.length === ls.length ? t("rienCocher") : t("toutCocher")}</button></div>
      </section>`;
    });
    return h;
  }

  // ================= Semaine (suivi) =================
  function seance(s) {
    if (s.regalo) return `<div class="seance regalo"><div class="h"><span>${date(Deberes.jour(new Date(s.inicio)))} · ${heure(s.inicio)}</span></div><div class="t">${t("regalo")}</div></div>`;
    const titre = s.leccion === REPASO ? s.titulo : LECONS[s.leccion] ? titreComplet(s.leccion) : s.titulo || s.leccion;
    const tags = [s.terminada ? "" : t("nonFinie"), ...(s.avisos || []).map((a) => t(a))].filter(Boolean).map((x) => `<span class="tag">${echap(x)}</span>`).join("");
    const fallos = s.fallos.length ? `${t("aRevoir")} <b>${s.fallos.map((f) => echap(etiquetteFallo(f)) + (f.n > 1 ? ` ×${f.n}` : "")).join(", ")}</b>` : t("sansFaute");
    return `<div class="seance"><div class="h"><span>${date(s.fecha)} · ${heure(s.inicio)}</span><span>${s.minutos} ${t("min")} · ${t("pauses", s.pausas)}</span></div>
      <div class="t">${echap(titre)}${tags}</div><div class="r">${fallos}</div>${s.aparato ? `<div class="a">${echap(s.aparato)}</div>` : ""}</div>`;
  }
  function pageSemaine() {
    const lundi = plus(lundiDe(hoy()), decalage * 7);
    const regalos = Object.values((P && P.tickets && P.tickets.ganados) || {}).filter((x) => x.motivo === "regalo").map((x) => ({ regalo: true, inicio: x.fecha, fecha: Deberes.jour(new Date(x.fecha)) }));
    const dansSem = (d) => (jourVu ? d === jourVu : d >= lundi && d <= plus(lundi, 6));
    const liste = [...S.filter((s) => dansSem(s.fecha)), ...regalos.filter((r) => dansSem(r.fecha))].sort((x, y) => String(y.inicio).localeCompare(String(x.inicio)));
    const ph = resume(lundi);
    const ap = Object.entries((P && P.aparatos) || {}).sort((x, y) => String(y[1].visto).localeCompare(String(x[1].visto)));
    const vu = (iso) => { const j = Deberes.jour(new Date(iso)); return j === hoy() ? `${t("auj")} ${heure(iso)}` : quand(j); };
    // Ce qui revient le plus : en combien de séances c'est arrivé (pas de note, pas de pourcentage).
    const limite = plus(hoy(), -14), compte = {};
    S.filter((s) => s.fecha >= limite).forEach((s) => s.fallos.forEach((f) => { (compte[f.leccion + "|" + f.txt] ??= { f, n: 0 }).n++; }));
    const top = Object.values(compte).sort((a, b) => b.n - a.n).slice(0, 5);
    return `<h1>${t("semaine")}</h1>
      <section class="carte semaine"><div class="tete"><b>${decalage === 0 ? t("cetteSem") : t("semDu", date(lundi))}</b>
        <div class="nav-s"><button data-s="-1" aria-label="${t("precedente")}"${decalage <= -3 ? " disabled" : ""}><svg class="ic" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button><button data-s="1" aria-label="${t("suivante")}"${decalage >= 0 ? " disabled" : ""}><svg class="ic" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button></div></div>
        <div class="jours7">${rangee(lundi, "suivi")}</div>${ph ? `<p class="phrase">${ph}</p>` : ""}</section>
      <h2>${jourVu ? t("seancesDu", date(jourVu)) : t("seancesSem")}</h2>
      <div class="carte">${liste.length ? liste.map(seance).join("") : `<p class="rien">${jourVu ? t("aucune") : t("aucuneSem")}</p>`}</div>
      <p class="petit">${ap.length ? `${t("synchro")} ${ap.map(([n, a]) => `${echap(n)} ${vu(a.visto)}`).join(" · ")}` : t("aucunTel")}</p>
      <h2>${t("coince")}</h2>
      ${top.length ? `<ul class="carte liste">${top.map(({ f, n }) => `<li><div class="ligne"><span class="t"><b>${echap(etiquetteFallo(f))}</b></span><span class="q">${MAT.includes(matiere(f.leccion)) ? t(matiere(f.leccion)) : ""} · ${n}×</span></div></li>`).join("")}</ul>` : `<p class="carte rien">${t("rienCoince")}</p>`}`;
  }

  // ================= Réglages =================
  const reg = (lib, ctrl) => `<div class="reglage"><span class="lib">${lib}</span>${ctrl}</div>`;
  function nbParties() {
    const tk = (P && P.tickets) || { ganados: {}, gastados: {} };
    const attente = Object.keys(lireLocal(REGALOS, {})).filter((k) => !tk.ganados[k]).length;
    if (!P && !attente) return t("partiesInconnu");
    return t("parties", Math.max(0, Object.keys(tk.ganados).length - Object.keys(tk.gastados).length) + attente) + (attente ? t("regaloAttente") : "");
  }
  // Les jeux de la pause (BRIEF-mini-parties.md) : rangés dans « pausa » (clé déjà connue du script Google : rien à redéployer).
  // pausa.juegos = { modo: "mini" | "pausa", eleccion, duracion, bloque, permitidos: [...] } ; seuls le mode et les jeux se règlent ici,
  // le reste garde les valeurs du brief (au hasard, partie courte, 3 exercices).
  const JEUX = [["minero", "El pequeño minero"], ["guardianes", "Los guardianes"], ["burbujas", "Cañón de burbujas"], ["caminos", "Tres caminos"]];
  const JEUX_DEFAUT = { modo: "mini", eleccion: "auto", duracion: "corta", bloque: 3, permitidos: JEUX.map(([id]) => id) };
  const juegos = () => ({ ...JEUX_DEFAUT, ...((A.pausa || {}).juegos || {}) });
  const changerJeux = (partiel) => changer({ pausa: { ...(A.pausa || {}), juegos: { ...juegos(), ...partiel } } });

  function pageReglages() {
    const pz = A.pausa || {};
    const opt = (v, lab, sel) => `<option value="${v}"${v === sel ? " selected" : ""}>${lab}</option>`;
    const ap = Object.entries((P && P.aparatos) || {}).sort((x, y) => String(y[1].visto).localeCompare(String(x[1].visto)));
    const vu = (iso) => { const j = Deberes.jour(new Date(iso)); return j === hoy() ? `${t("auj")} ${heure(iso)}` : quand(j); };
    const jx = juegos();
    return `<h1>${t("reglages")}</h1>
      <h2>${t("gJeu")}</h2><div class="carte">
        <div class="reglage" style="display:block"><span class="lib">${t("modeLab")}</span><div class="choix-l col" role="group" aria-label="${t("modeLab")}"><button data-mode="mini" aria-pressed="${jx.modo === "mini"}">${t("modeMini")}</button><button data-mode="pausa" aria-pressed="${jx.modo === "pausa"}">${t("modeGrande")}</button></div></div>
        ${jx.modo === "mini" ? `${reg(t("blocLab"), `<select id="blocJeux" aria-label="${t("blocLab")}">${[2, 3].map((n) => opt(n, t("blocN", n), +jx.bloque === 2 ? 2 : 3)).join("")}</select>`)}<div class="reglage" style="display:block"><span class="lib">${t("jeuxLab")}</span>
          <ul class="prog" style="margin-top:4px">${JEUX.map(([id, nom]) => `<li><label><input type="checkbox" data-jeu="${id}"${jx.permitidos.includes(id) ? " checked" : ""}><span>${nom}</span></label></li>`).join("")}</ul>
          <p class="petit" id="msgJeux" role="alert" style="margin-top:2px"></p></div>` : `
        ${reg(t("trabajo"), `<select id="trabajoMin" aria-label="${t("trabajo")}">${[10, 15, 20].map((n) => opt(n, t("mn", n), [15, 20].includes(pz.trabajo) ? pz.trabajo : 10)).join("")}</select>`)}
        ${reg(t("pausa"), `<select id="pausaMin" aria-label="${t("pausa")}">${[5, 10].map((n) => opt(n, t("mn", n), pz.minutos === 10 ? 10 : 5)).join("")}</select>`)}`}
        ${reg(echap(nbParties()), `<button class="btn" id="regalar">${t("offrir")}</button>`)}
        ${reg(t("libre"), `<input type="checkbox" class="inter" id="libreBonus" aria-label="${t("libre")}"${pz.libreEnBonus ? " checked" : ""}>`)}
      </div>
      <h2>${t("gSeance")}</h2><div class="carte">
        ${reg(t("repaso"), `<select id="repasoDia" aria-label="${t("repaso")}">${[1, 2, 3, 4, 5, 6, 0].map((d) => opt(d, t("chaque", t("joursL")[d]), +(A.repasoDia ?? 5))).join("")}</select>`)}
        ${reg(t("tranquilo"), `<input type="checkbox" class="inter" id="tranquilo" aria-label="${t("tranquilo")}"${pz.tranquilo ? " checked" : ""}>`)}
      </div>
      <h2>${t("gTel")}</h2><div class="carte">
        ${ap.length ? ap.map(([n, a]) => reg(echap(n), `<small>${t("vu")} ${vu(a.visto)}</small>`)).join("") : `<p class="rien">${t("aucunTel")}</p>`}
        <div class="ajout">
          <label class="lib" for="nomAppareil">${t("ajouterTel")}</label>
          <div class="rang"><input type="text" id="nomAppareil" list="nomsAppareils" placeholder="${t("nomTel")}" autocomplete="off"><button class="btn prim" id="creerLien">${t("creer")}</button></div>
          <datalist id="nomsAppareils"><option value="móvil de la abuela"><option value="móvil de Dorian"><option value="tablet"></datalist>
          <div id="resultatLien" class="ajout" style="padding:0;border:0"${lienCree ? "" : " hidden"}>
            <div class="qr" id="qr"></div>
            <div class="rang" style="flex-wrap:wrap"><button class="btn" id="partager">${t("envoyer")}</button><button class="btn" id="copier">${t("copier")}</button></div>
            <p class="lienBranchement">${echap(lienCree)}</p>
            <p class="petit" style="margin:0">${t("telAide")}</p>
          </div>
        </div>
      </div>
      <h2>${t("gAcces")}</h2><div class="carte">
        ${reg(t("langueLab"), `<div class="choix-l" role="group"><button data-l="fr">Français</button><button data-l="es">Español</button></div>`)}
        ${reg(t("changerCode"), `<button class="btn" id="changerCode">${t("modifier")}</button>`)}
        ${reg(t("verrouiller"), `<button class="btn" id="verrouiller">${t("verrouiller")}</button>`)}
        ${reg(`<span class="danger">${t("deconnecter")}</span>`, `<button class="btn" id="deconnecter">${t("deconnecter").split(" ")[0]}</button>`)}
      </div>`;
  }

  // ================= Affichage =================
  const PAGES = ["hoy", "lecons", "semaine", "reglages"];
  const ICONES = {
    hoy: `<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>`,
    lecons: `<svg class="ic" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>`,
    semaine: `<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
    reglages: `<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>`,
  };
  function textesFixes() {
    document.documentElement.lang = LANGUE;
    document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t(e.dataset.t)));
    document.querySelectorAll("[data-l]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === LANGUE));
  }
  function afficher() {
    if ($("contenu").hidden) return textesFixes();
    page = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "hoy";
    const liens = PAGES.map((k) => `<a href="#${k}"${k === page ? ' aria-current="page"' : ""}>${ICONES[k]}<span>${t(k)}</span></a>`).join("");
    $("nav").innerHTML = liens;
    $("onglets").innerHTML = liens;
    // On garde ce qui est en train d'être tapé (le nom d'un téléphone) d'un affichage à l'autre.
    const nomEnCours = $("nomAppareil")?.value || "";
    $("main").innerHTML = `<div class="page">${({ hoy: pageHoy, lecons: pageLecons, semaine: pageSemaine, reglages: pageReglages })[page]()}</div>`;
    if ($("nomAppareil")) $("nomAppareil").value = nomEnCours;
    if (page === "reglages" && lienCree) dessinerQR();
    textesFixes();
    etat(etatSync.classe, etatSync.texte, etatSync.reessayer);
  }
  addEventListener("hashchange", () => { jourVu = null; afficher(); scrollTo(0, 0); });

  // ================= Les actions (un seul écouteur pour toute la page) =================
  document.addEventListener("click", (ev) => {
    const el = (sel) => ev.target.closest(sel);
    let x;
    if ((x = el("[data-l]"))) { LANGUE = x.dataset.l; try { localStorage.setItem(CLE_LANGUE, LANGUE); } catch {} if (!$("ecranCode").hidden) demanderCode(mode); afficher(); return; }
    if (el("[data-reessayer]")) { envoyer(); return; }
    if (el("[data-forcer]")) { forcerOuvert = true; afficher(); $("forcer")?.focus(); return; }
    if ((x = el("[data-pj]"))) { jourPlan = jourPlan === x.dataset.pj ? null : x.dataset.pj; afficher(); return; }
    if ((x = el("[data-pm]"))) { if (jourPlan) changerPlan(jourPlan, x.dataset.pm); return; }
    if ((x = el("[data-tout]"))) { const ls = leconsDe(x.dataset.tout); cocher(ls, !ls.every((k) => auProgramme(k))); return; }
    if ((x = el("[data-s]")) && !x.disabled) { decalage += +x.dataset.s; jourVu = null; afficher(); return; }
    if ((x = el("[data-j]"))) {
      if (page !== "semaine") { decalage = Math.round(Deberes.ecart(lundiDe(hoy()), lundiDe(x.dataset.j)) / 7); jourVu = x.dataset.j; location.hash = "semaine"; return; }
      jourVu = jourVu === x.dataset.j ? null : x.dataset.j; afficher(); return;
    }
    if ((x = el("[data-mode]"))) return changerJeux({ modo: x.dataset.mode });
    if (el("#regalar")) return regaler();
    if (el("#creerLien")) return creerLien();
    if (el("#partager")) { navigator.share?.({ title: t("marque"), text: t("partageTexte"), url: lienCree }).catch(() => {}); return; }
    if ((x = el("#copier"))) { navigator.clipboard.writeText(lienCree).then(() => { x.textContent = t("copie"); }).catch(() => prompt(t("copierPrompt"), lienCree)); return; }
    if (el("#changerCode")) return demanderCode("choisir");
    if (el("#verrouiller")) { sessionStorage.removeItem(OUVERT); return demanderCode(); }
    if (el("#deconnecter")) { if (!confirm(t("deconnecterConfirm"))) return; Sync.debrancher(); sessionStorage.removeItem(OUVERT); return montrer("ecranLien"); }
  });
  document.addEventListener("change", (ev) => {
    const c = ev.target;
    if (c.dataset.prog) return cocher([c.dataset.prog], c.checked);
    if (c.dataset.ex) return changerExamen(c.dataset.ex, c.value && c.value >= hoy() ? c.value : "");
    if (c.id === "forcer") { forcerOuvert = !!c.value; return changer({ forzada: c.value ? { lecon: c.value, fecha: hoy() } : null }); }
    if (c.id === "repasoDia") return changer({ repasoDia: +c.value });
    if (c.id === "blocJeux") return changerJeux({ bloque: +c.value === 2 ? 2 : 3 });
    if (c.dataset.jeu) {
      const liste = [...document.querySelectorAll("[data-jeu]:checked")].map((e) => e.dataset.jeu);
      if (!liste.length) { c.checked = true; $("msgJeux").textContent = t("unJeu"); return; }
      return changerJeux({ permitidos: liste });
    }
    if (["trabajoMin", "pausaMin", "tranquilo", "libreBonus"].includes(c.id)) {
      const pz = A.pausa || {};
      return changer({ pausa: { ...pz, minutos: +($("pausaMin")?.value || pz.minutos || 5) === 10 ? 10 : 5, trabajo: +($("trabajoMin")?.value || pz.trabajo || 10),
        tranquilo: $("tranquilo") ? $("tranquilo").checked : !!pz.tranquilo, libreEnBonus: $("libreBonus") ? $("libreBonus").checked : !!pz.libreEnBonus } });
    }
  });

  // ================= Charger =================
  async function charger() {
    // D'abord la copie de cet appareil (et ce qui n'est pas encore parti), puis le Sheet.
    A = { ...(Sync.ajustes() || {}), ...lireLocal(PENDIENTE, {}) };
    afficher();
    etat("attente", t("sSync"));
    try {
      const [a, s, p] = await Promise.all([Sync.rafraichirAjustes(), Sync.sesiones(), Sync.lireProgreso().catch(() => null)]);
      A = { ...a, ...lireLocal(PENDIENTE, {}) };
      S = s || [];
      P = p;
      afficher();
      envoyerRegalos();
      if (lireLocal(PENDIENTE, null)) envoyer();
      else etat("ok", t("sAjour", heure(new Date())));
    } catch (err) {
      afficher();
      etat("erreur", t("sHorsLigne", A.recu ? `${date(Deberes.jour(new Date(A.recu)))} ${heure(A.recu)}` : t("sAvant")));
    }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("contenu").hidden) charger(); });

  // ================= Les parties offertes =================
  // Un cadeau a un id unique : s'il part deux fois (réseau qui coupe), il ne compte qu'une fois.
  async function envoyerRegalos() {
    const attente = lireLocal(REGALOS, {});
    if (!Object.keys(attente).length) return;
    try {
      P = await Sync.ajouterProgreso({ tickets: { ganados: attente, gastados: {} } });
      const reste = lireLocal(REGALOS, {});
      Object.keys(attente).forEach((k) => delete reste[k]);
      ecrireLocal(REGALOS, Object.keys(reste).length ? reste : null);
      etat("ok", t("sGarde", heure(new Date())));
    } catch (err) {
      etat("erreur", `${t("sPasGarde")} (${err.message})`);
    }
    afficher();
  }
  function regaler() {
    if (!confirm(t("offrirConfirm"))) return;
    const id = "r-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    ecrireLocal(REGALOS, { ...lireLocal(REGALOS, {}), [id]: { fecha: new Date().toISOString(), motivo: "regalo" } });
    afficher();
    envoyerRegalos();
  }

  // ================= Ajouter un téléphone pour Dorian (lien + QR code) =================
  function creerLien() {
    const nombre = $("nomAppareil").value.trim() || t("nomDefaut");
    lienCree = Sync.lienBranchement(new URL("index.html", location.href).href, nombre);
    afficher();
  }
  async function dessinerQR() {
    const zone = $("qr");
    if (!zone) return;
    $("partager").hidden = !navigator.share;
    try {
      // La bibliothèque du QR code n'est chargée qu'ici (rien d'autre n'en a besoin).
      if (!window.qrcode) await new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"; sc.onload = ok; sc.onerror = ko; document.head.append(sc); });
      const q = qrcode(0, "M"); q.addData(lienCree); q.make();
      if ($("qr")) $("qr").innerHTML = q.createSvgTag({ scalable: true, margin: 0 });
    } catch { if ($("qr")) $("qr").innerHTML = `<p style="color:#4A5751;line-height:1.4;max-width:200px">${t("qrHorsLigne")}</p>`; }
  }

  // ================= Entrée : lien, puis code =================
  const ECRANS = ["ecranLien", "ecranCode", "contenu"];
  function montrer(id) { ECRANS.forEach((e) => ($(e).hidden = e !== id)); textesFixes(); }
  $("okLien").addEventListener("click", async () => {
    $("msgLien").textContent = "";
    $("okLien").disabled = true;
    try { A = await Sync.brancher($("champLien").value); $("champLien").value = ""; demanderCode(); }
    catch (err) { $("msgLien").textContent = t("pasConnecte", err.message); }
    $("okLien").disabled = false;
  });
  let mode = "taper", premier = "";
  function demanderCode(m) {
    const a = Sync.ajustes() || {};
    mode = m || (a.codigo ? "taper" : "choisir");
    premier = "";
    $("titreCode").textContent = mode === "taper" ? t("codeTitre") : t("codeChoisir");
    $("texteCode").textContent = mode === "taper" ? t("codeTaper") : t("codeChoisirTexte");
    $("champCode").setAttribute("aria-label", t("codeTitre"));
    $("oubli").hidden = mode !== "taper";
    $("champCode").value = ""; $("msgCode").textContent = "";
    montrer("ecranCode");
    $("champCode").focus();
  }
  $("champCode").addEventListener("input", async (ev) => {
    const v = ev.target.value.replace(/\D/g, "").slice(0, 4);
    ev.target.value = v;
    if (v.length < 4) return;
    if (mode === "taper") {
      // Le code a pu changer sur un autre appareil : on relit les réglages si on a du réseau.
      let a = Sync.ajustes() || {};
      if (a.codigo !== empreinte(v)) a = (await Sync.rafraichirAjustes().catch(() => null)) || a;
      if (a.codigo === empreinte(v)) { sessionStorage.setItem(OUVERT, "1"); ouvrir(); }
      else { $("msgCode").textContent = t("codeFaux"); ev.target.value = ""; }
      return;
    }
    if (!premier) { premier = v; ev.target.value = ""; $("texteCode").textContent = t("codeEncore"); return; }
    if (v !== premier) { premier = ""; ev.target.value = ""; $("texteCode").textContent = t("codePasPareil"); return; }
    try {
      A = await Sync.guardarAjustes({ codigo: empreinte(v) });
      sessionStorage.setItem(OUVERT, "1");
      ouvrir();
    } catch (err) { $("msgCode").textContent = t("codePasGarde", err.message); premier = ""; ev.target.value = ""; }
  });
  // Code oublié : celui qui a le lien du script (avec sa clé) peut en choisir un nouveau.
  $("oubli").addEventListener("click", () => {
    const x = prompt(t("oubliPrompt"));
    if (!x) return;
    try { if (Sync.lireLien(x).cle !== Sync.lien()?.cle) throw new Error(); demanderCode("choisir"); }
    catch { $("msgCode").textContent = t("oubliFaux"); }
  });

  function ouvrir() { montrer("contenu"); charger(); }

  textesFixes();
  if (!Sync.lien()) montrer("ecranLien");
  else if (sessionStorage.getItem(OUVERT)) ouvrir();
  else demanderCode();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
