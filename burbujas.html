<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cañón de burbujas</title>
<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="pause.css?v=1">
<style>
  .bulle{top:auto;bottom:110px}
</style>
</head>
<body>
<main class="jeu">
  <div class="hud"><h1>Burbujas</h1><div class="temps"><i id="barre"></i></div><span class="total" id="total"><span class="ani"><img id="dernier" src="img/03.jpg" alt=""></span><span id="nb">0</span></span></div>
  <div class="ultimo" id="ultimo" hidden>¡Último minuto!</div>
  <section class="terrain" id="terrain">
    <canvas id="toile"></canvas>
    <div class="bulle" id="bulle" hidden></div>
  </section>
</main>
<section class="ecran-fin" id="fin" hidden></section>

<script src="commun.js?v=10"></script>
<script src="animaux.js?v=12"></script>
<script src="sync.js?v=7"></script>
<script src="pause-commun.js?v=2"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOUX = DOUX_JEU;
  // Ses animaux sont coincés dans des prisons de leur monde (bulle d'eau, cocon de feuilles, glace, ambre) :
  // il les libère en tirant des bulles. Chaque animal libéré rejoint la rangée qui l'encourage sur l'herbe.
  const POOL = mesAnimaux();
  let pile = [];
  const prochainAnimal = () => { if (!pile.length) pile = melange(POOL.slice()); return animalN(pile.pop()); };
  let ratees = 0;
  const IMGS = {};
  const charger = (n) => { if (!IMGS[n]) { IMGS[n] = imageSure(imgAnimal(n)); IMGS[n].addEventListener("error", () => ratees++); } }; // redemandée si elle rate
  const DORES = ANIMAUX.filter((a) => a.oro).map((a) => a.n);
  // les animaux détourés (sprites) : partout dans le jeu ; le rond ne reste que pour le compteur
  const SPR = {};
  const chargerSpr = (n) => { if (!SPR[n]) SPR[n] = imageSure(spriteAnimal(n)); };
  POOL.forEach(charger); DORES.forEach(charger); POOL.forEach(chargerSpr); DORES.forEach(chargerSpr);
  const MARINS = [1, 2, 3, 4, 5, 6, 12, 13]; // sur l'herbe, ceux-là restent dans une petite bulle d'eau

  // ---- Chaque animal libéré aide pendant 7 s avec son pouvoir (les mêmes que dans Los guardianes) ----
  const FAMILLES = { rompe: [2, 3, 9, 11, 12, 15, 18], atrae: [1, 8], rapido: [6, 10, 13, 17], rebota: [4, 5, 7, 14, 16] };
  const familleDe = (n) => Object.keys(FAMILLES).find((k) => FAMILLES[k].includes(n)) || "rapido";
  const POUVOIRS = {
    1: ["Atrae", "atrae las burbujas con sus tentáculos"], 2: ["Rompe todo", "rompe todo lo que toca"], 3: ["Gigante del mar", "es gigante y lo rompe todo"],
    4: ["Rebota", "nada muy, muy alto"], 5: ["Rebota", "tiene caparazón: rebota sin parar"], 6: ["Rapidísimo", "nada rapidísimo"],
    7: ["Rebota", "salta muy alto y baja despacito"], 8: ["Lengua mágica", "atrae las burbujas con su lengua"], 9: ["Rompe las rocas", "rompe las rocas con sus puños"],
    10: ["Rapidísimo", "corre rápido y dispara el doble"], 11: ["Rompe el hielo", "rompe el hielo"], 12: ["Cuerno mágico", "lo rompe todo con su cuerno"],
    13: ["La más rápida", "es la más rápida del mar"], 14: ["Rebota", "salta dos veces en la nieve"], 15: ["El más fuerte", "es el más fuerte: lo rompe todo"],
    16: ["Salta altísimo", "salta altísimo"], 17: ["El más rápido", "dispara más rápido que nadie"], 18: ["Gigante aplastador", "es gigante y lo aplasta todo"],
  };
  const DUREE_AIDE = 7;
  const COUL_MONDE = { mar: "#7FC8F8", selva: "#3E9B4F", polos: "#DDF3FF", gigantes: "#F0A422" };
  const ARC = ["#E0453F", "#F08A1C", "#F2B90F", "#2E9E57", "#3FB8E8", "#B05BE0"];

  // ---- Le temps : le rythme monte doucement, la fin est une fiesta ----
  const debutJeu = performance.now();
  // Le gran Nubarrón arrive ~42 s avant la fin. Il ne fait rien à Dorian et éclate TOUJOURS avant la fin :
  // sa vie ne peut jamais dépasser une ligne qui descend jusqu'à zéro 6 s avant l'arrêt.
  const BOSS_DEBUT = DUREE_JEU - (TEST_RAPIDE ? DUREE_JEU * .45 : Math.min(42000, DUREE_JEU * .3));
  const BOSS_FIN = DUREE_JEU - (TEST_RAPIDE ? DUREE_JEU * .1 : 6000);
  const PV_BOSS = TEST_RAPIDE ? 150 : 900;
  // … et il ne peut pas tomber trop vite non plus : au moins ~25 s de combat, même s'il tire parfaitement.
  const BOSS_MIN = TEST_RAPIDE ? (BOSS_FIN - BOSS_DEBUT) * .7 : 25000;
  // Les Nubarroncitos : une vague de ~20 s vers 1 min 15 (puis toutes les ~100 s dans une longue partie).
  const VAGUE_DUREE = TEST_RAPIDE ? DUREE_JEU * .15 : 20000;
  const VAGUES = [];
  for (let v = TEST_RAPIDE ? DUREE_JEU * .2 : Math.min(75000, DUREE_JEU * .42); v + VAGUE_DUREE < BOSS_DEBUT - (TEST_RAPIDE ? 0 : 15000); v += TEST_RAPIDE ? 1e9 : 100000) VAGUES.push(v);
  const PV_MINI = TEST_RAPIDE ? 12 : 25; // assez solides pour avoir le temps de faire leur bêtise
  const PERIODE_SPECIAL = TEST_RAPIDE ? Math.max(3000, DUREE_JEU / 6) : 10000; // un ballon spécial toutes les ~10 s
  const PERIODE_PORTES = TEST_RAPIDE ? Math.max(5, DUREE_JEU / 4000) : 22;      // les portes changent toutes les ~22 s
  // Une prison cède en ~8 s s'il vise bien, ~12 s au hasard (mesuré : 38 et 27 coups/s avec les portes), du début à la fin.
  const PV = TEST_RAPIDE ? 60 : 320;

  // ---- Toile ----
  const toile = $("toile"), g = toile.getContext("2d");
  let L, H, U;
  function dimensionner() {
    const dpr = Math.min(devicePixelRatio || 1, 2), t = $("terrain");
    L = t.clientWidth; H = t.clientHeight; toile.width = L * dpr; toile.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.min(L / 400, H / 700);
  }
  addEventListener("resize", dimensionner); dimensionner();
  const rect = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };

  // ---- Sons (jamais de son d'échec) ----
  const sonTir = () => note(700 + Math.random() * 200, 1000, .05, .03);
  const sonPlop = (d) => note(480 + d * 900 + Math.random() * 60, 320 + d * 600, .07, .06); // monte à mesure que la prison cède
  const sonFissure = () => { bruitFiltre(2200, 2, .12, .45); note(1500, 900, .06, .05, "triangle"); };
  const sonPorte = (v) => note(v >= 5 ? 880 : v >= 3 ? 660 : 520, v >= 5 ? 1760 : v >= 3 ? 1320 : 880, .15, .08);
  const sonGlobo = () => note(1200, 300, .12, .14, "triangle");
  const sonEclate = () => {
    bruitFiltre(900, .8, .35, 1.2); note(300, 80, .3, .2, "triangle");
    [[660, 990], [880, 1320], [1175, 1760]].forEach(([a, b], i) => setTimeout(() => note(a, b, i === 2 ? .3 : .15, .14), 150 + i * 100));
  };
  const sonRugit = () => { bruitFiltre(160, .6, .8, 1.3); note(150, 70, .7, .2, "triangle"); };
  const sonSpecial = () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => note(f, f * 1.5, .14, .1), i * 70));

  // ---- Le canon : il tire tout seul, on le glisse avec le doigt ----
  const canon = { x: 0, cible: 0, recul: 0 };
  let posé = false;
  function viser(e) { const b = toile.getBoundingClientRect(); canon.cible = Math.max(30 * U, Math.min(L - 30 * U, e.clientX - b.left)); posé = true; }
  toile.addEventListener("pointerdown", (e) => { audio().resume?.(); try { toile.setPointerCapture(e.pointerId); } catch {} viser(e); toile.dataset.tenu = 1; });
  toile.addEventListener("pointermove", (e) => { if (toile.dataset.tenu) viser(e); });
  toile.addEventListener("pointerup", () => { delete toile.dataset.tenu; });

  // ---- Les portes magiques : +2, +3, ×2, ×3, et parfois une ×5 arc-en-ciel ----
  const OPS = [["+", 2], ["+", 3], ["×", 2], ["×", 3]];
  let portes = [], sortantes = [], portesT = 0;
  function nouvellesPortes() {
    sortantes = portes; sortantes.forEach((p) => (p.app = 1));
    portes = []; portesT = 0;
    const rare = Math.random() < .2 ? Math.floor(Math.random() * 4) : -1;
    [[.6, 1], [.4, -1]].forEach(([fy, sens], r) => {
      const ops = melange(OPS.slice()).slice(0, 2);
      const ph = Math.random() * 6, vit = sens * (.6 + Math.random() * .3); // les 2 portes d'une rangée bougent ensemble
      ops.forEach((op, i) => portes.push({ op: r * 2 + i === rare ? ["×", 5] : op, base: i ? .7 : .3, x: L * (i ? .7 : .3), y: H * fy, w: 104 * U, h: 36 * U, ph, vit, joie: 0, popT: 0, app: 0, id: Math.random() }));
    });
  }
  const valeur = (p, n) => p.op[0] === "×" ? n * p.op[1] : n + p.op[1];
  function dessinerPorte(p, t, s) {
    const fort = p.op[0] === "×", rare = p.op[1] >= 5;
    g.save(); g.translate(p.x, p.y); g.scale(s, s);
    if (rare) {
      const gr = g.createLinearGradient(-p.w / 2, 0, p.w / 2, 0);
      ARC.forEach((c, i) => gr.addColorStop((i / ARC.length + t / 3000) % 1, c));
      g.fillStyle = gr;
    } else g.fillStyle = fort ? "rgba(242,185,15,.85)" : "rgba(46,158,87,.85)";
    rect(-p.w / 2, -p.h / 2, p.w, p.h, 14 * U); g.fill();
    g.strokeStyle = "#fff"; g.lineWidth = (rare ? 4 : 3) * U; g.stroke();
    g.font = `900 ${(rare ? 27 : 24) * U}px Lexend, system-ui`; g.textAlign = "center"; g.textBaseline = "middle";
    if (rare) { g.lineWidth = 5 * U; g.strokeStyle = "#1E2A44"; g.strokeText(p.op[0] + p.op[1], 0, 1 * U); }
    g.fillStyle = rare ? "#fff" : fort ? "#1E2A44" : "#fff";
    g.fillText(p.op[0] + p.op[1], 0, 1 * U);
    if (rare && !DOUX) for (let k = 0; k < 3; k++) { const a = t / 400 + k * 2.1; g.fillStyle = "#fff"; g.beginPath(); g.arc(Math.cos(a) * p.w * .55, Math.sin(a) * p.h * .75, 2.5 * U, 0, 7); g.fill(); }
    g.restore();
  }

  // ---- Petits textes qui sautent (« ×3! ») ----
  const textes = [];
  const pop = (x, y, txt, c = "#fff", taille = 22) => textes.push({ x, y, txt, c, taille, t: .8 });

  // ---- Bulles, ballons, prison, confettis ----
  let bulles = [], ballons = [], confettis = [], geante = null, libres = 0, tirT = 0;
  let pouvoir = { type: null, t: 0 }, prochainSpecial = PERIODE_SPECIAL * .6, cycleSpecial = [], secousse = 0, fiesta = false;
  const eclats = new Eclats();
  const liberations = [];
  let coups = 0;
  let aide = null, boss = null, bossFait = false, victoire = false;
  let minis = [], etoiles = [], vague = -1, vagueFin = 0, prochainMini = 0, minisEclates = 0;
  const cible = () => (boss && !boss.vaincu ? boss : geante);

  function nouvelleGeante() {
    if (fini || boss || bossFait) return;
    if (performance.now() - debutJeu >= BOSS_DEBUT) { lancerBoss(); return; }
    const a = prochainAnimal(), r = 64 * U;
    // fissures (glace, ambre) préparées d'avance : elles apparaissent une à une
    const fissures = Array.from({ length: 7 }, (_, i) => {
      const an = i / 7 * 6.28 + Math.random() * .6, pts = [];
      for (let k = 0; k <= 4; k++) { const d = r * (.2 + k * .2), j = (Math.random() - .5) * .35; pts.push([Math.cos(an + j) * d, Math.sin(an + j) * d]); }
      return pts;
    });
    const feuilles = Array.from({ length: 14 }, (_, i) => ({ an: i / 14 * 6.28 + Math.random() * .2, seuil: (i * 5 % 14 + 1) / 15, c: ["#2E9E57", "#3E9B4F", "#56B868", "#237A43"][i % 4] }));
    geante = { a, x: L / 2, y: -90 * U, cibleY: H * .15, r, pv: PV, pvMax: PV, tremble: 0, vx: 22 * U * (Math.random() < .5 ? 1 : -1), fissures, feuilles, etape: 0, age: 0 };
  }
  function lancerBallon(type = "n") {
    const gauche = Math.random() < .5, special = type !== "n";
    const vit = special ? 34 + Math.random() * 10 : 45 + Math.random() * 30;
    ballons.push({ type, x: gauche ? -40 * U : L + 40 * U, y: H * (type === "gros" ? .3 : .27 + Math.random() * .06), vx: (gauche ? 1 : -1) * vit * U,
      r: (type === "gros" ? 36 : special ? 24 : 20) * U, pv: type === "gros" ? 6 : 1, tremble: 0, c: ARC[Math.floor(Math.random() * ARC.length)], ph: Math.random() * 6 });
  }
  const bulle = (txt, ms, or) => messageJeu($("bulle"), txt, ms, or);
  function confetti(x, y, n, couleurs) {
    if (DOUX) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = (2 + Math.random() * 6) * U; confettis.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3 * U, t: 1.4, c: couleurs[i % couleurs.length], s: (5 + Math.random() * 5) * U, r: Math.random() * 6 }); }
  }

  // ---- La rangée des animaux libérés, sur l'herbe : ils sautent de joie ----
  const fans = [];
  const MAX_FANS = () => Math.max(4, Math.floor((L - 20 * U) / (34 * U)));
  const placeFan = (i, n) => L * (i + .5) / n;
  const acclamer = () => fans.forEach((f, i) => (f.saut = 1 + i * .08));

  function liberer() {
    const G = geante, a = G.a;
    libres++; compteurPop($("total"), libres, $("nb")); $("dernier").src = imgAnimal(a.n);
    liberations.push(Math.round((performance.now() - debutJeu) / 100) / 10);
    confetti(G.x, G.y, 70, ["#E0453F", "#F2B90F", "#2E9E57", "#3FB8E8", "#B05BE0", "#fff"]);
    eclats.jaillir(G.x, G.y, COUL_MONDE[a.m], 18, 1.3, 1.3); eclats.jaillir(G.x, G.y, "#fff", 10, 1.1);
    secousse = .4; sonEclate(); vibrer([30, 40, 70]);
    const nom = nomMaj(a);
    bulle(`¡${nom} es libre!`, 2400, true); dire(`¡${nom} es libre!`);
    volants.push({ a, x: G.x, y: G.y, t: 0, depart: Math.random() * 6.28 });
    acclamer();
    geante = null; nouvellesPortes();
    setTimeout(nouvelleGeante, 2600);
  }
  const volants = [];

  // ---- Frapper la cible (prison ou Nubarrón) ----
  function frapper(dmg, x, y) {
    if (boss && !boss.vaincu) return frapperBoss(dmg, x, y);
    const G = geante; if (!G) return;
    G.pv -= dmg; G.tremble = 1;
    if (!DOUX && Math.random() < .5) eclats.jaillir(x, y, "#fff", 1, .6, .6);
    const d = 1 - Math.max(0, G.pv) / G.pvMax, etape = Math.floor(d * 8);
    if (etape > G.etape) { G.etape = etape; sonFissure(); vibrer(8); eclats.jaillir(G.x + (Math.random() - .5) * G.r, G.y + G.r * .5, COUL_MONDE[G.a.m], 4, .8, .9); }
    else if (Math.random() < .35) sonPlop(d);
    if (G.pv <= 0) liberer();
  }
  function frapperBoss(dmg, x, y) {
    const B = boss; B.pv -= dmg; B.tremble = 1;
    if (!DOUX && Math.random() < .5) eclats.jaillir(x, y, "#fff", 1, .6, .6);
    const d = 1 - Math.max(0, B.pv) / B.pvMax, etape = Math.floor(d * 12);
    if (etape > B.etape) { B.etape = etape; sonFissure(); vibrer(8); if (etape % 2 === 0) pop(x, y, ["¡Zas!", "¡Toma!", "¡Pum!"][etape / 2 % 3], "#F2B90F", 20); }
    else if (Math.random() < .3) sonPlop(d);
  }

  // ---- Un ballon qui éclate (par une bulle ou par un animal qui rebondit) ----
  function eclaterBallon(j) {
    const bl = ballons[j]; ballons.splice(j, 1); sonGlobo(); vibrer(15);
    if (bl.type === "or") { confetti(bl.x, bl.yy, 30, ["#F2B90F", "#fff", "#F08A1C"]); pouvoir = { type: "or", t: 6 }; bulle("¡Súper burbujas!", 2000, true); dire("¡Súper burbujas!"); sonSpecial(); acclamer(); }
    else if (bl.type === "arco") { confetti(bl.x, bl.yy, 36, ARC); pouvoir = { type: "arco", t: 5 }; bulle("¡Burbujas arcoíris!", 2000, true); dire("¡Burbujas arcoíris!"); sonSpecial(); acclamer(); }
    else if (bl.type === "gros") {
      confetti(bl.x, bl.yy, 40, ARC.concat("#fff")); sonSpecial(); vibrer([20, 30, 20]); acclamer();
      bulle("¡Lluvia de globos!", 2000, true); dire("¡Lluvia de globos!");
      for (let k = 0; k < 7; k++) { const a = k / 7 * 6.28; ballons.push({ type: "mini", x: bl.x + Math.cos(a) * 20 * U, y: bl.yy + Math.sin(a) * 20 * U, vx: Math.cos(a) * 55 * U, vy: (Math.sin(a) * 40 - 25) * U, r: 13 * U, pv: 1, tremble: 0, c: ARC[k % ARC.length], ph: 0 }); }
    } else { confetti(bl.x, bl.yy, bl.type === "mini" ? 10 : 14, [bl.c, "#fff"]); pop(bl.x, bl.yy - bl.r, "¡Pop!", "#fff", 16); }
  }

  // ---- L'animal qui aide : il arrive après son tour d'honneur ----
  function finirAide() {
    if (!aide) return;
    fans.push({ n: aide.a.n, x: aide.x, ph: Math.random() * 6, saut: 1, tirT: Math.random() });
    while (fans.length > MAX_FANS()) fans.shift();
    aide = null;
  }
  function lancerAide(a, x, y) {
    finirAide();
    aide = { a, type: familleDe(a.n), t: DUREE_AIDE, x, y, vx: (Math.random() < .5 ? -1 : 1) * 230 * U, vy: -330 * U, cycle: 0, frappe: false, cd: 0 };
    const [court, phrase] = POUVOIRS[a.n] || ["¡Ayuda!", "te ayuda"];
    bulle(`¡${court}!`, 2600, true); // court : l'animal est à côté du canon, la voix dit son nom dire(`¡${nomMaj(a)} ${phrase}!`); sonSpecial();
  }
  function majAide(dt, t, CY) {
    const A = aide, C = cible();
    A.t -= dt;
    const ax = canon.x + (canon.x > L / 2 ? -52 : 52) * U, ay = CY - 8 * U;
    let x = ax, y = ay, r = 20 * U, rot = 0;
    if (A.type === "rebota") { // il rebondit partout : il éclate les ballons et cogne la cible
      r = 24 * U; A.x += A.vx * dt; A.y += A.vy * dt;
      if (A.x < r) A.vx = Math.abs(A.vx); if (A.x > L - r) A.vx = -Math.abs(A.vx);
      if (A.y < H * .05 + r) A.vy = Math.abs(A.vy); if (A.y > H * .72) A.vy = -Math.abs(A.vy);
      x = A.x; y = A.y; rot = A.t * 6;
      for (let j = ballons.length - 1; j >= 0; j--) if (Math.hypot(ballons[j].x - x, ballons[j].yy - y) < ballons[j].r + r) eclaterBallon(j);
      A.cd -= dt;
      if (C && A.cd <= 0 && Math.hypot(C.x - x, C.y - y) < C.r + r) {
        A.cd = .35; A.vy = Math.abs(A.vy); A.vx *= -1; pop(x, y - r, "¡Boing!", "#fff", 20); SONS_JEU.boing();
        frapper(C === boss ? boss.pvMax * .02 : C.pvMax * .07, x, y);
      }
    } else if (A.type === "rompe" && C) { // il fonce sur la cible toutes les 1,5 s
      A.cycle += dt; const ph = A.cycle % 1.5;
      if (ph < .6) {
        const k = Math.sin(ph / .6 * Math.PI); x = ax + (C.x - ax) * k; y = ay + (C.y + C.r * .4 - ay) * k; r = 26 * U; rot = k * .5;
        if (ph >= .3 && !A.frappe) {
          A.frappe = true; SONS_JEU.casse(); secousse = Math.max(secousse, .25); vibrer(25);
          pop(x, y - 20 * U, "¡CRAC!", "#fff", 26); eclats.jaillir(x, y, "#fff", 8, 1.1);
          frapper(C === boss ? boss.pvMax * .03 : C.pvMax * ([3, 18].includes(A.a.n) ? .14 : .1), x, y);
        }
      } else A.frappe = false;
    } else if (A.type === "atrae" && C) { // tentacule ou langue : les bulles filent vers la cible (voir les bulles)
      const l = .55 + .3 * Math.sin(t / 260), ex = x + (C.x - x) * l, ey = y + (C.y - y) * l;
      g.strokeStyle = A.a.n === 8 ? "#E0607A" : "#E58C7A"; g.lineWidth = 7 * U; g.lineCap = "round";
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo((x + ex) / 2 + Math.sin(t / 200) * 30 * U, (y + ey) / 2, ex, ey); g.stroke();
      g.fillStyle = g.strokeStyle; g.beginPath(); g.arc(ex, ey, 7 * U, 0, 7); g.fill();
    } else if (A.type === "rapido" && !DOUX) { // traits de vitesse
      g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 3 * U; g.lineCap = "round";
      for (let k = 0; k < 3; k++) { const yy = y - 10 * U + k * 10 * U, o = (t / 60 + k * 7) % 14; g.beginPath(); g.moveTo(x - 30 * U - o * U, yy); g.lineTo(x - 44 * U - o * U, yy); g.stroke(); }
    }
    if (A.type !== "rebota") { A.x = x; A.y = y; }

  minuteurJeu({ barre: $("barre"), bandeau: $("ultimo"), annonce: "¡Último minuto! ¡Vamos, todos juntos!",
    surFin: () => { fini = true; finDePause($("fin"), "¡Qué buen rescate!", (libres === 1 ? "Has liberado a un animal" : `Has liberado a ${libres} animales`) + (victoire ? " y has vencido al gran Nubarrón." : ".")); } });
  if (TEST_RAPIDE) window.burbujas = {
    get libres() { return libres; }, get bulles() { return bulles.length; }, get geante() { return geante && geante.pv; },
    get fans() { return fans.map((f) => f.n).join(","); }, get liberations() { return liberations; }, get ballons() { return ballons.map((b) => b.type); },
    get portes() { return portes.map((p) => p.op.join("")); }, get pouvoir() { return pouvoir.t > 0 ? pouvoir.type : null; },
    ratees: () => ratees, get coups() { return coups; }, get gx() { return geante ? Math.round(geante.x) : null; }, imgs: () => Object.entries(IMGS).map(([n, i]) => n + ":" + imagePrete(i)).join(" "),
    abimer: (d) => { if (geante) { geante.pv = Math.round(geante.pvMax * (1 - d)); geante.etape = Math.floor(d * 8); } },
    lancer: lancerBallon, liberer: () => geante && liberer(),
    get aide() { return aide && aide.type + ":" + aide.a.n; }, get boss() { return boss ? Math.round(boss.pv) + "/" + boss.pvMax + " phase " + boss.phase : bossFait ? (victoire ? "vaincu" : "fini") : null; },
    get victoire() { return victoire; }, get minis() { return minis.map((m) => m.type + ":" + m.etat + ":" + m.pv + "@" + Math.round(m.x) + "," + Math.round(m.y)).join(" "); }, get minisEclates() { return minisEclates; },
    vagues: VAGUES, mini: (type) => { vagueFin = Math.max(vagueFin, performance.now() - debutJeu + 10000); lancerMini(type); }, aider: (n) => lancerAide(animalN(n), L / 2, H * .7), nubarron: () => { if (geante) geante = null; if (!boss) lancerBoss(); },
    monde: (m) => { const n = ANIMAUX.find((a) => a.m === m).n; if (geante) { geante.a = animalN(n); } },
  };
})();
</script>
