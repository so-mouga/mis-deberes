<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Los guardianes</title>
<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="pause.css?v=1">
<style>
  /* Choix du gardien */
</style>
</head>
<body>
<main class="jeu">
  <div class="hud"><h1>Guardianes</h1><div class="temps"><i id="barre"></i></div><span class="total" id="total"><i id="pastille"></i><span id="nb">0</span></span></div>
  <div class="ultimo" id="ultimo" hidden>¡Último minuto!</div>
  <section class="choix" id="choix">
    <h2>Elige tu guardián</h2>
    <div class="heros" id="heros"></div>
  </section>
  <section class="terrain" id="terrain" hidden>
    <canvas id="toile"></canvas>
    <div class="bulle" id="bulle" hidden></div>
  </section>
</main>
<section class="ecran-fin" id="fin" hidden></section>

<script src="commun.js?v=10"></script>
<script src="animaux.js?v=12"></script>
<script src="sync.js?v=5"></script>
<script src="pause-commun.js?v=2"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOUX = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- Chaque animal a son pouvoir (et nage s'il vit dans l'eau) ----
  const NAGEURS = [1, 2, 3, 4, 5, 6, 12, 13];
  const POUVOIRS = {
    1:  { txt: "Atrae los tesoros", dit: "atrae los tesoros con sus tentáculos", iman: "tentacule" },
    2:  { txt: "Rompe todo", dit: "rompe todo lo que toca", casse: 1, vit: 1.1 },
    3:  { txt: "Gigante del mar", dit: "es gigante y lo rompe todo", casse: 1, taille: 1.3, vit: .92 },
    4:  { txt: "Nada muy alto", dit: "nada muy, muy alto", nage: 1.3 },
    5:  { txt: "Nunca se cae", dit: "tiene caparazón: nunca se cae", solide: 1 },
    6:  { txt: "Nada rapidísimo", dit: "nada rapidísimo", vit: 1.25 },
    7:  { txt: "Salta y flota", dit: "salta muy alto y baja despacito", grav: .6 },
    8:  { txt: "Lengua mágica", dit: "atrapa los tesoros con su lengua", iman: "langue" },
    9:  { txt: "Rompe las rocas", dit: "rompe las rocas con sus puños", casse: 1 },
    10: { txt: "Salto doble", dit: "corre rápido y salta dos veces", vit: 1.15, sauts: 2 },
    11: { txt: "Rompe el hielo", dit: "rompe el hielo", casse: 1, taille: 1.15 },
    12: { txt: "Cuerno mágico", dit: "lo rompe todo con su cuerno", casse: 1 },
    13: { txt: "La más rápida", dit: "es la más rápida del mar", vit: 1.3 },
    14: { txt: "Salto doble", dit: "salta dos veces en la nieve", sauts: 2 },
    15: { txt: "El más fuerte", dit: "es el más fuerte: lo rompe todo", casse: 1 },
    16: { txt: "Salta altísimo", dit: "salta altísimo", saut: 1.25 },
    17: { txt: "El más rápido", dit: "corre más rápido que nadie", vit: 1.3 },
    18: { txt: "Gigante aplastador", dit: "es gigante y lo aplasta todo", casse: 1, taille: 1.35, vit: .95 },
  };
  const pouvoir = (n) => ({ vit: 1, saut: 1, grav: 1, nage: 1, taille: 1, sauts: 1, ...POUVOIRS[n] });

  // ---- Images d'évolution (en préparation avec Gemini) ----
  // À brancher ici quand elles arrivent : une image par niveau (2, 3, 4), par exemple
  // 18: [null, "img/evo/18-2.jpg", "img/evo/18-3.jpg", "img/evo/18-4.jpg"].
  // Sans image, l'animal garde sa photo et les effets de niveau (traînée, aimant, couronne).
  const EVOLUTIONS = {};

  // ---- Les 4 mondes : couleurs, obstacles, et le trésor qu'on y ramasse ----
  const MONDES = {
    mar:      { item: "perlas",    couleur: "#FFFFFF", bord: "#9FC2F0" },
    selva:    { item: "frutas",    couleur: "#F08A1C", bord: "#2E9E57" },
    polos:    { item: "cristales", couleur: "#7FD6E8", bord: "#3E6E99" },
    gigantes: { item: "gemas",     couleur: "#E0453F", bord: "#A82B26" },
  };
  // Évolution du gardien : jamais liée à une réussite, on ramasse toujours
  const NIVEAUX = [0, 35, 100, 200];
  const ANNEAUX = ["#FFFFFF", "#C9D6F5", "#F2B90F", "arc"];
  const ARC = ["#E0453F", "#F08A1C", "#F2B90F", "#2E9E57", "#3FB8E8", "#B05BE0"];

  // ---- 1. Choisir son gardien parmi SES animaux ----
  choixAnimal($("heros"), { sousTitre: (a) => pouvoir(a.n).txt, surChoix: commencer });
  dire("¡Los guardianes! Elige tu guardián.");

  // ---- Toile ----
  const toile = $("toile"), g = toile.getContext("2d");
  let L, H, U, SOL, HX;
  function dimensionner() {
    const dpr = Math.min(devicePixelRatio || 1, 2), t = $("terrain");
    L = t.clientWidth; H = t.clientHeight;
    toile.width = L * dpr; toile.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = H / 700; SOL = H * .8; HX = L * .26;
  }
  addEventListener("resize", () => { if (!$("terrain").hidden) dimensionner(); });

  // ---- Sons courts (jamais de son d'échec) ----
  const bruit = bruitFiltre;
  const sonSaut = () => note(420, 760, .14, .1);
  const sonDouble = () => { note(620, 1180, .14, .1); setTimeout(() => note(880, 1500, .12, .08), 70); };
  const sonNage = () => { note(300, 520, .12, .08); bruit(1400, 2, .08, .25); };
  const GAMME = [1046, 1175, 1318, 1568, 1760, 2093, 2349, 2637]; // les trésors enchaînés montent d'une note
  let combo = 0, dernierItem = 0;
  const sonItem = () => {
    const now = performance.now();
    combo = now - dernierItem < 900 ? Math.min(combo + 1, GAMME.length - 1) : 0; dernierItem = now;
    note(GAMME[combo], GAMME[combo] * 1.5, .1, .09);
  };
  const sonCasse = () => { bruit(700, 1.5, .25, 1); note(200, 110, .16, .22, "triangle"); note(130, 55, .32, .25, "triangle"); };
  const sonBoing = () => { note(260, 520, .18, .14, "triangle"); setTimeout(() => note(520, 300, .14, .08, "triangle"), 120); };
  const sonClonc = () => { note(700, 660, .08, .12, "square"); setTimeout(() => note(500, 480, .1, .08, "square"), 60); };
  const sonLance = () => note(180, 900, .32, .15, "triangle");
  const sonOnde = () => { note(90, 45, .3, .25, "triangle"); bruit(200, 1, .25, .6); };
  const sonEvolution = () => [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => note(f, f * 1.02, .2, .12), i * 90));
  const vibre = vibrer;

  // ---- État de la partie ----
  let A, P, nage, monde, fini = false, dist = 0, vitesse = 0, prochain = 0, derniereEtoile = 0;
  let items = 0, niveau = 0, superT = 0, secousse = 0, debut = 0, flash = 0, ceremonie = 0, boost = 0, doubles = 0;
  let aSemer = null, prochaineSurprise = 0, ordreSurprises = [], lluviaT = 0, lluviaPas = 0, amigo = null;
  const objets = [], eclats = [], pops = [], ondes = [], fumees = [], ambiance = [];
  const heros = { y: 0, vy: 0, sauts: 0, chute: 0, ecrase: 1, tourne: 0, vrille: 0, charge: 0, auSol: true, img: imageSure(), imgs: [], taille: 1 };

  // Une surprise toutes les 30 à 40 s (bien plus souvent en test rapide)
  const SURPRISES = ["lluvia", "cofre", "amigo", "arcoiris", "etoile"];
  const ECART_SURPRISE = TEST_RAPIDE ? Math.max(3500, DUREE_JEU / 6) : 33000;

  function commencer(a) {
    A = a; P = pouvoir(a.n); nage = NAGEURS.includes(a.n); monde = MONDES[a.m];
    audio().resume?.();
    $("choix").hidden = true; $("terrain").hidden = false; dimensionner();
    $("pastille").style.background = monde.couleur; $("pastille").style.borderColor = monde.bord;
    heros.img.src = imgAnimal(a.n);
    heros.sprite = imageSure(spriteAnimal(a.n));
    heros.imgs = (EVOLUTIONS[a.n] || []).map((src) => { if (!src) return null; return imageSure(src); });
    heros.y = nage ? H * .45 : SOL - rayon(); heros.vy = 0; heros.sauts = P.sauts;
    prochain = L * .9; derniereEtoile = 0;
    ordreSurprises = SURPRISES.slice().sort(() => Math.random() - .5);
    prochaineSurprise = Date.now() + ECART_SURPRISE * (TEST_RAPIDE ? 1 : .75);
    preparerAmbiance();
    const nom = a.es.charAt(0).toUpperCase() + a.es.slice(1);
    dire(`¡${nom}! ${nom} ${P.dit}. Toca la pantalla para ${nage ? "nadar" : "saltar"}.`);
    bulle(nage ? "Toca para nadar" : "Toca para saltar", 2800);
    debut = Date.now(); minuteur(); requestAnimationFrame(boucle);
  }

  const rayon = () => 34 * U * P.taille * heros.taille;
  const tailleCible = () => (superT > 0 ? 1.45 : 1) * (1 + niveau * .08);
  // Rayon de l'aimant : le pulpo et le camaleón l'ont dès le départ, tout le monde l'a au niveau 3
  const rayonAimant = () => (P.iman ? 170 : 0) * U + (niveau >= 2 ? 130 * U : 0);

  // ---- Une seule action : toucher l'écran ----
  toile.addEventListener("pointerdown", () => {
    if (fini) return;
    if (nage) {
      heros.vy = -430 * U * P.nage; sonNage(); heros.ecrase = .8;
      for (let i = 0; i < 4; i++) fumee(HX - rayon() * .7, heros.y + (Math.random() - .5) * rayon(), "bulle");
      return;
    }
    if (heros.sauts > 0) {
      const double = !heros.auSol; // déjà en l'air : c'est le 2e saut
      heros.vy = -1050 * U * P.saut * (double ? .92 : 1); heros.sauts--; heros.ecrase = .75; heros.auSol = false;
      if (double) {
        heros.vrille = 1; sonDouble(); vibre(12);
        for (let i = 0; i < 7; i++) fumee(HX + (Math.random() - .5) * rayon() * 1.4, heros.y + rayon(), "nuage", "#FFFFFF");
        if (doubles++ < 3) pop(HX, heros.y + rayon() + 20 * U, "¡Doble!", "#FFFFFF");
      } else {
        sonSaut();
        for (let i = 0; i < 4; i++) fumee(HX + (Math.random() - .5) * rayon(), SOL, "nuage", couleurPoussiere());
      }
    }
  });

  // ---- Ce qui arrive devant : obstacles, trésors, plateformes, surprises ----
  const hasard = (a, b) => a + Math.random() * (b - a);
  const arc = (x0, y0, n, dx, haut) => { for (let i = 0; i < n; i++) objets.push({ t: "item", x: x0 + i * dx, y: y0 - Math.sin(i / (n - 1) * Math.PI) * haut }); };
  function semer() {
    const x = prochain, special = aSemer; aSemer = null;
    let fin = x;
    if (special === "cofre") {
      const w = 90 * U, h = 74 * U;
      objets.push({ t: "cofre", x, w, h, annonce: "¡Un cofre del tesoro!" });
      fin = x + w;
    } else if (special === "arcoiris") {
      if (nage) {
        const R = 220 * U, base = SOL - 30 * U;
        objets.push({ t: "arche", x, cx: x + R, R, base, annonce: "¡Un arcoíris de tesoros!" });
        for (let i = 0; i < 11; i++) { const a = Math.PI - i / 10 * Math.PI; objets.push({ t: "item", x: x + R + Math.cos(a) * R, y: base - Math.sin(a) * R }); }
        fin = x + 2 * R;
      } else {
        objets.push({ t: "lanzador", k: "arcoiris", x, w: 64 * U, annonce: "¡Un puente arcoíris!" });
        const px = x + 150 * U, w = 720 * U, y = SOL - 200 * U;
        objets.push({ t: "plat", arc: true, x: px, w, y });
        for (let i = 0; i < 12; i++) objets.push({ t: "item", x: px + 30 * U + i * (w - 60 * U) / 11, y: y - 34 * U });
        fin = px + w;
      }
    } else if (special === "etoile") {
      objets.push({ t: "etoile", x, y: nage ? H * .45 : SOL - 150 * U }); derniereEtoile = dist; fin = x + 60 * U;
    } else if (Math.random() < .32) {
      fin = passageDuMonde(x);
    } else if (nage) {
      const r = Math.random(), surface = H * .14;
      if (r < .38) { // corail qui monte du fond, avec des perles au-dessus
        const h = hasard(.18, .34) * H, w = 54 * U;
        objets.push({ t: "obst", k: "corail", x, w, h });
        arc(x - 40 * U, SOL - h - 70 * U, 4, 45 * U, 40 * U); fin = x + w;
      } else if (r < .68) { // méduse rigolote qui flotte
        const y = hasard(surface + 90 * U, SOL - 140 * U);
        objets.push({ t: "meduse", x, y0: y, y, r: 26 * U, ph: Math.random() * 6 });
        const autre = y > H * .45 ? y - 130 * U : y + 130 * U;
        arc(x - 60 * U, autre, 4, 42 * U, 0); fin = x + 80 * U;
      } else { // vague de perles
        const y0 = hasard(surface + 80 * U, SOL - 80 * U);
        for (let i = 0; i < 6; i++) objets.push({ t: "item", x: x + i * 42 * U, y: y0 + Math.sin(i * .9) * 50 * U });
        fin = x + 250 * U;
      }
    } else {
      const r = Math.random();
      const k = { selva: "tronco", polos: "hielo", gigantes: "roca" }[A.m];
      if (r < .36) { // un obstacle, et un arc de trésors pour le sauter
        const h = hasard(40, 72) * U, w = hasard(46, 70) * U;
        objets.push({ t: "obst", k, x, w, h });
        arc(x - 50 * U, SOL - 70 * U, 5, 40 * U, 120 * U); fin = x + w;
      } else if (r < .62) { // une plateforme avec des trésors dessus
        const w = hasard(160, 230) * U, y = SOL - hasard(140, 175) * U;
        objets.push({ t: "plat", x, w, y });
        for (let i = 0; i < 4; i++) objets.push({ t: "item", x: x + 25 * U + i * (w - 50 * U) / 3, y: y - 34 * U });
        fin = x + w;
      } else if (r < .8) { // deux petits obstacles
        const h = 42 * U, w = 46 * U;
        objets.push({ t: "obst", k, x, w, h }, { t: "obst", k, x: x + 300 * U, w, h });
        arc(x + 80 * U, SOL - 40 * U, 4, 40 * U, 0); fin = x + 300 * U + w;
      } else { // une file de trésors au sol
        for (let i = 0; i < 5; i++) objets.push({ t: "item", x: x + i * 40 * U, y: SOL - 30 * U });
        fin = x + 200 * U;
      }
    }
    // l'étoile de temps en temps (en plus de la surprise « étoile »)
    if (!special && dist - derniereEtoile > 5200 * U) {
      objets.push({ t: "etoile", x: fin + 140 * U, y: nage ? hasard(H * .14 + 80 * U, SOL - 90 * U) : SOL - 150 * U }); derniereEtoile = dist;
    }
    prochain = fin + hasard(320, 470) * U * Math.max(1, vitesseBase() / (220 * U));
  }
  // Les passages propres à chaque monde
  function passageDuMonde(x) {
    const premier = Math.random() < .5;
    if (nage) {
      if (premier) { // un courant de bulles qui fait remonter
        const w = 110 * U; objets.push({ t: "corriente", x, w });
        for (let i = 0; i < 5; i++) objets.push({ t: "item", x: x + w / 2, y: SOL - 70 * U - i * 66 * U });
        return x + w;
      }
      objets.push({ t: "almeja", x }); return x + 60 * U; // une coquille qui s'ouvre sur des perles
    }
    if (premier) { // le tremplin du monde : feuille, bosse de neige, geyser
      objets.push({ t: "lanzador", k: { selva: "hoja", polos: "nieve", gigantes: "geiser" }[A.m], x, w: 64 * U });
      arc(x + 20 * U, SOL - 120 * U, 7, 42 * U, 260 * U); return x + 330 * U;
    }
    if (A.m === "selva") { // des lianes chargées de fruits
      for (let i = 0; i < 3; i++) {
        const lx = x + i * 150 * U, ly = SOL - hasard(150, 190) * U;
        objets.push({ t: "liana", x: lx, y: ly, ph: Math.random() * 6 });
        for (let k = 0; k < 3; k++) objets.push({ t: "item", x: lx + (k - 1) * 22 * U, y: ly + 16 * U + (k === 1 ? 12 * U : 0) });
      }
      return x + 330 * U;
    }
    if (A.m === "polos") { // une piste de glace où l'on glisse très vite
      const w = 560 * U; objets.push({ t: "pista", x, w });
      for (let i = 0; i < 8; i++) objets.push({ t: "item", x: x + 40 * U + i * 65 * U, y: SOL - 30 * U });
      return x + w;
    }
    for (let i = 0; i < 3; i++) objets.push({ t: "huevo", x: x + i * 190 * U }); // des œufs géants qui éclosent en gemmes
    return x + 420 * U;
  }
  const vitesseBase = () => 220 * U * P.vit * (1 + Math.min(.2, (Date.now() - debut) / 180000 * .2));

  // ---- Les surprises ----
  function surprise(k) {
    if (fini) return;
    if (k === "lluvia") {
      lluviaT = 5; lluviaPas = 0; sonBien();
      bulle("¡Lluvia de tesoros!", 2600, true); dire(`¡Lluvia de ${monde.item}!`);
    } else if (k === "amigo") {
      const memes = mesAnimaux(1).filter((n) => n !== A.n && NAGEURS.includes(n) === nage);
      const liste = memes.length ? memes : mesAnimaux(1).filter((n) => n !== A.n);
      const a = animalN(liste[Math.floor(Math.random() * liste.length)] || (A.n === 6 ? 5 : 6));
      const img = imageSure(imgAnimal(a.n)); const sprite = imageSure(spriteAnimal(a.n));
      amigo = { a, img, sprite, t: 10, x: -40 * U, y: heros.y, part: false };
      sonBien(); bulle("¡Un amigo te ayuda!", 2600, true); dire(`¡Mira! ¡${nomMaj(a)} viene a ayudarte!`);
    } else aSemer = k; // apparaît devant, annoncé quand il arrive à l'écran
  }

  // ---- Petits événements ----
  const bulle = (txt, ms, or) => messageJeu($("bulle"), txt, ms, or);
  function jaillir(x, y, couleur, n, force = 1) {
    if (DOUX) n = Math.ceil(n / 3);
    n = Math.min(n, 260 - eclats.length); // le téléphone de la grand-mère dit merci
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = (2 + Math.random() * 5) * force; eclats.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2.5, t: 1, s: (4 + Math.random() * 6) * U * 1.4, c: couleur }); }
  }
  // Petits textes qui montent (« +1 », « ¡CRAC! »)
  function pop(x, y, txt, c, taille = 1) { if (pops.length < 14) pops.push({ x, y, txt, c, t: 1, taille }); }
  // Poussière, nuages, bulles, vapeur
  function fumee(x, y, k, c) {
    if (DOUX && Math.random() < .6) return;
    if (fumees.length > 90) return;
    const bulleEau = k === "bulle";
    fumees.push({ x, y, k, c: c || "#FFFFFF", vx: (Math.random() - .5) * (bulleEau ? 30 : 90) * U, vy: (bulleEau ? -hasard(60, 120) : -hasard(10, 50)) * U, r: (bulleEau ? hasard(3, 7) : hasard(6, 13)) * U, t: 1 });
  }
  const couleurPoussiere = () => ({ selva: "#C9A27A", polos: "#FFFFFF", gigantes: "#E9CB8A" })[A.m] || "#FFFFFF";

  function ramasser(o, sx, sy) {
    o.pris = true; items++; $("nb").textContent = items; sonItem();
    const t = $("total"); t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
    jaillir(sx, sy, monde.couleur, 4, .6);
    pop(sx, sy - 12 * U, "+1", "#FFFFFF", combo >= 4 ? 1.25 : 1);
    // Il évolue en ramassant (ça arrive toujours, ce n'est jamais un score à atteindre)
    if (niveau < NIVEAUX.length - 1 && items >= NIVEAUX[niveau + 1]) evoluer();
  }
  function evoluer() {
    niveau++; ceremonie = 1.3; flash = DOUX ? .25 : .7; sonEvolution(); vibre([20, 40, 20, 40, 60]);
    jaillir(HX, heros.y, "#F2B90F", 30, 1.5); jaillir(HX, heros.y, "#FFFFFF", 14, 1.2);
    ondes.push({ x: HX, y: heros.y, r: rayon(), t: 1, c: "#F2B90F" });
    const quoi = ["", "¡Ahora brilla!", P.iman ? "¡Atrae los tesoros desde más lejos!" : "¡Ahora atrae los tesoros!", "¡Con corona de guardián!"][niveau];
    bulle(`¡Nivel ${niveau + 1}!`, 2800, true); // court, pour tenir sur un téléphone ; la voix dit le reste
    pop(HX, heros.y - rayon() - 40 * U, ["", "¡Brilla!", "¡Imán!", "¡Corona!"][niveau], "#F2B90F", 1.4);
    dire(`¡Tu guardián crece! ¡Nivel ${niveau + 1}! ${quoi}`);
  }
  function trebucher(o) {
    o.touche = true;
    if (superT > 0 || heros.chute > 0) return;
    if (P.solide) { // la tortue : « ¡Clonc! » et elle ne bouge pas
      o.tremble = .5; sonClonc(); vibre(10);
      pop(HX + rayon(), heros.y - rayon(), "¡Clonc!", "#FFFFFF", 1.1);
      return;
    }
    heros.chute = .7; heros.vy = -520 * U; sonBoing(); vibre(15);
    pop(HX, heros.y - rayon() - 10 * U, rireAuHasard(), "#FFFFFF");
    if (Math.random() < .35) dire(rireAuHasard());
  }
  function casser(o, sx) {
    o.casse = true; sonCasse(); vibre(40);
    const gros = P.taille >= 1.3;
    if (!DOUX) secousse = gros ? 22 : 15;
    const c = { corail: "#F28AB2", tronco: "#8A5A2E", hielo: "#CFE8FF", roca: "#9C6B3F" }[o.k] || "#999";
    const mx = sx + o.w / 2, my = SOL - o.h / 2;
    jaillir(mx, my, c, 22, 1.8); jaillir(mx, my, "#FFFFFF", 6, 1.2);

  // ---- Les décors (jamais de noir) ----
  function decor(t) {

      : ({ selva: ["#BFF0D0", "#E9FBEF"], polos: ["#D6E4FF", "#F1F5FF"], gigantes: ["#FFD38A", "#FFF1CF"] })[m];
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, ciel[0]); gr.addColorStop(1, ciel[1]);
    g.fillStyle = gr; g.fillRect(0, 0, L, H);

      g.fillStyle = m === "polos" ? "#E7F0FF" : "#F2D58A"; g.fillRect(0, SOL, L, H - SOL);
      g.fillStyle = "rgba(0,0,0,.06)"; for (let i = 0; i < 12; i++) { const x = loin(1, L) + i * L / 6; g.beginPath(); g.arc(x, SOL + 20 * U + (i % 3) * 18 * U, 4 * U, 0, 7); g.fill(); }
    } else {

      for (let i = 0; i < 3; i++) { const x = loin(.06, L * 1.5) + i * L * .55, y = H * (.12 + (i % 2) * .1); g.beginPath(); g.arc(x, y, 22 * U, 0, 7); g.arc(x + 26 * U, y - 8 * U, 28 * U, 0, 7); g.arc(x + 54 * U, y, 20 * U, 0, 7); g.fill(); }
      // montagnes / collines au loin

      g.fillStyle = couleursLoin;
      for (let i = 0; i < 5; i++) { const x = loin(.15, L * 1.6) + i * L * .45; g.beginPath(); g.moveTo(x - 120 * U, SOL); g.lineTo(x, SOL - (m === "selva" ? 150 : 230) * U); g.lineTo(x + 120 * U, SOL); g.fill(); }
      if (m === "gigantes") { // volcan qui fume doucement
        const x = loin(.1, L * 2) + L * 1.2; g.fillStyle = "#B5734A"; g.beginPath(); g.moveTo(x - 110 * U, SOL); g.lineTo(x - 30 * U, SOL - 260 * U); g.lineTo(x + 30 * U, SOL - 260 * U); g.lineTo(x + 110 * U, SOL); g.fill();
        g.fillStyle = "rgba(255,255,255,.6)"; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + Math.sin(t / 900 + i) * 12 * U, SOL - (285 + i * 30) * U - (t / 40 % 30) * U, (16 + i * 6) * U, 0, 7); g.fill(); }
      }

        const x = loin(.45, L * 1.4) + i * L * .38;
        if (m === "selva") { g.fillStyle = "#8A5A2E"; g.fillRect(x - 6 * U, SOL - 120 * U, 12 * U, 120 * U); g.fillStyle = "#2E9E57"; g.beginPath(); g.arc(x, SOL - 130 * U, 46 * U, 0, 7); g.arc(x - 30 * U, SOL - 110 * U, 30 * U, 0, 7); g.arc(x + 32 * U, SOL - 108 * U, 30 * U, 0, 7); g.fill(); }
        else if (m === "polos") { g.fillStyle = "#3E6E99"; g.beginPath(); g.moveTo(x, SOL - 120 * U); g.lineTo(x + 34 * U, SOL - 20 * U); g.lineTo(x - 34 * U, SOL - 20 * U); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x, SOL - 120 * U); g.lineTo(x + 14 * U, SOL - 80 * U); g.lineTo(x - 14 * U, SOL - 80 * U); g.fill(); }

  // ---- Un peu de vie au fond, pâle et lente (pour ne pas brouiller le jeu) ----
  function preparerAmbiance() {
    ambiance.length = 0;
    const k = nage ? "poisson" : { selva: "papillon", polos: "neige", gigantes: "feuille" }[A.m];
    let n = { poisson: 4, papillon: 3, neige: 26, feuille: 7 }[k];
    if (DOUX_JEU) n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) ambiance.push({ k, x: Math.random() * L, y: hasard(H * .2, SOL - 40 * U), v: hasard(.6, 1.4), ph: Math.random() * 6, c: ["#F2B90F", "#E77FB0", "#FFFFFF", "#7FD6E8"][i % 4] });
  }
  let avantAmbiance = 0;
  function dessinerAmbiance(t) {
    const dt = Math.min(.04, (t - avantAmbiance) / 1000 || 0); avantAmbiance = t;
    const lent = DOUX_JEU ? .5 : 1;
    for (const p of ambiance) {
      if (p.k === "poisson") {
        p.x -= (25 + vitesse * .15) * p.v * dt * lent; if (p.x < -40 * U) { p.x = L + 40 * U; p.y = hasard(H * .2, SOL - 60 * U); }
        const y = p.y + Math.sin(t / 900 + p.ph) * 8 * U, s = 10 * U * p.v;
        g.fillStyle = "rgba(255,255,255,.28)";

        g.beginPath(); g.moveTo(p.x + s * 1.4, y); g.lineTo(p.x + s * 2.6, y - s * .8); g.lineTo(p.x + s * 2.6, y + s * .8); g.fill();
      } else if (p.k === "papillon") {
        p.x -= (20 + vitesse * .2) * p.v * dt * lent; if (p.x < -20 * U) { p.x = L + 20 * U; p.y = hasard(H * .2, SOL - 80 * U); }
        const y = p.y + Math.sin(t / 500 + p.ph) * 20 * U, b = Math.abs(Math.sin(t / 90 + p.ph)) * 8 * U + 2 * U;
        g.globalAlpha = .75; g.fillStyle = p.c;
        g.beginPath(); g.ellipse(p.x - b * .6, y, b, 7 * U, -.4, 0, 7); g.ellipse(p.x + b * .6, y, b, 7 * U, .4, 0, 7); g.fill();
        g.globalAlpha = 1;
      } else if (p.k === "neige") {
        p.y += 30 * p.v * U * dt * lent; p.x -= (10 + vitesse * .25) * dt * lent + Math.sin(t / 800 + p.ph) * .3;
        if (p.y > SOL) { p.y = -5; p.x = Math.random() * L * 1.2; } if (p.x < -5) p.x = L + 5;
        g.fillStyle = "rgba(255,255,255,.9)"; g.beginPath(); g.arc(p.x, p.y, 2.5 * U * p.v, 0, 7); g.fill();
      } else {
        p.x -= (30 + vitesse * .3) * p.v * dt * lent; p.y += Math.sin(t / 600 + p.ph) * .4;
        if (p.x < -20 * U) { p.x = L + 20 * U; p.y = hasard(H * .2, SOL - 60 * U); }
        g.save(); g.translate(p.x, p.y); g.rotate(t / 500 + p.ph); g.globalAlpha = .55;
        g.fillStyle = p.v > 1 ? "#6FA83A" : "#D9A23A"; g.beginPath(); g.ellipse(0, 0, 8 * U, 3.5 * U, 0, 0, 7); g.fill();
        g.restore();
      }
    }
  }

  function rect(x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
  function etoile5(x, y, k) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? k * .45 : k; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }

  // Ce qui est « au fond » (dessiné avant les trésors)
  const AU_FOND = ["arche", "corriente", "pista", "liana"];
  function dessinerFond(o, sx, t) {
    if (o.t === "arche") {
      const cx = o.cx - o.x + sx;

      g.globalAlpha = 1;
    } else if (o.t === "corriente") {
      g.fillStyle = "rgba(255,255,255,.13)"; rect(sx, H * .14, o.w, SOL - H * .14, 30 * U); g.fill();
      g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2.5 * U;
      const haut = SOL - H * .14;
      for (let k = 0; k < 9; k++) {
        const by = SOL - ((t / 4 + k * haut / 9) % haut), bx = sx + o.w * (.2 + (k * 37 % 60) / 100) + Math.sin(t / 300 + k) * 6 * U;
        g.beginPath(); g.arc(bx, by, (4 + k % 3 * 3) * U, 0, 7); g.stroke();
      }
    } else if (o.t === "pista") {
      g.fillStyle = "#BFE3FA"; rect(sx, SOL - 4 * U, o.w, 14 * U, 7 * U); g.fill();

      g.fillStyle = "#58B947";
      for (let k = 1; k < 5; k++) { const yy = o.y * k / 5; g.beginPath(); g.ellipse(sx + bal * k / 5 + (k % 2 ? 8 : -8) * U, yy, 9 * U, 4.5 * U, k % 2 ? .5 : -.5, 0, 7); g.fill(); }

  function dessinerObjet(o, sx, t) {

      } else if (o.k === "tronco") {

      } else if (o.k === "hielo") {

      } else {

      g.strokeStyle = "#1E2A44"; g.lineWidth = 2.5 * U; g.beginPath();

      g.fillStyle = "#A8743F"; rect(0, o.h * .35, o.w, o.h * .65, 8 * U); g.fill(); g.stroke();
      g.fillStyle = "#C48A4E"; rect(0, 0, o.w, o.h * .4, 18 * U); g.fill(); g.stroke();
      g.fillStyle = "#F2B90F"; g.fillRect(o.w * .1, 0, 9 * U, o.h); g.fillRect(o.w * .9 - 9 * U, 0, 9 * U, o.h);

        g.fillStyle = "#E0453F"; g.beginPath(); g.arc(cx, SOL - 22 * U * s, 7 * U, 0, 7); g.fill();

    }
    // petits textes qui montent
    g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i]; p.t -= dt * 1.3; p.y -= dt * 60 * U;
      if (p.t <= 0) { pops.splice(i, 1); continue; }
      const k = p.taille * (p.t > .85 ? 1 + (p.t - .85) * 3 : 1);
      p.x = Math.max(28 * U * p.taille + 10, Math.min(L - 28 * U * p.taille - 10, p.x)); // jamais coupé au bord
      g.globalAlpha = Math.min(1, p.t * 2.5);
      g.font = `900 ${Math.round(20 * U * k)}px Lexend, system-ui, sans-serif`;
      g.strokeStyle = "#1E2A44"; g.lineWidth = 5 * U; g.strokeText(p.txt, p.x, p.y);
      g.fillStyle = p.c; g.fillText(p.txt, p.x, p.y);
      g.globalAlpha = 1;
    }
    g.restore();
    if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash * .55})`; g.fillRect(0, 0, L, H); }
    if (!fini) requestAnimationFrame(boucle);
  }

  // ---- 3 minutes, « ¡Último minuto! » 30 s avant, puis la ballena ----
  const minuteur = () => minuteurJeu({ barre: $("barre"), bandeau: $("ultimo"), annonce: "¡Último minuto, guardián!", surFin: terminer });
  function terminer() {
    fini = true;
    const nom = nomMaj(A);
    finDePause($("fin"), "¡Guardián increíble!", `${nom} ha recogido ${items} ${monde.item} y ha llegado al nivel ${niveau + 1}.`);
  }

  if (TEST_RAPIDE) window.guardianes = {
    get heros() { return heros; }, get objets() { return objets; }, get items() { return items; }, get niveau() { return niveau; },
    surprise, evoluer, get amigo() { return amigo; },
  };
})();
</script>
